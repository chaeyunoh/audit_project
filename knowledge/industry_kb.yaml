          icon: sell
          do: "딜러·판매법인으로 판매하고 할부·리스와 판촉 인센티브를 준다"
          money: "고객·딜러 → 회사: 판매대금 / 회사 → 딜러: 판매장려금"
          books: "매출(판촉비 차감), 매출채권, 금융채권"
        보증·리콜:
          icon: repair
          do: "보증기간 동안 무상수리를 하고 결함 시 리콜한다"
          money: "회사 → 고객·정비망: 보증수리비, 리콜 비용"
          books: "판매보증충당부채, 우발부채 주석"
    traits:
      - trait_id: AUT-WARRANTY
        name: 판매보증과 리콜
        stage: 보증·리콜
        detect_keywords: [리콜, 판매보증, 품질비용, 무상수리, 보증충당]
        risks:
          # 공시 대조 ✅ 현대자동차: 세타2 엔진 등 리콜 정보를 판매보증충당부채에 반영, 협력사 등 제3자 변제자산 인식
          - risk_id: AUT-R1
            title: 판매보증충당부채와 리콜 비용 추정
            potential_risk: 보증수리 실적과 진행 중인 리콜·품질 이슈를 반영한 판매보증충당부채 추정의 완전성과 정확성에 대한 확인 필요성이 존재
            accounts: [판매보증충당부채, 매출원가, 우발부채 주석]
            assertions: [완전성, 평가와배분, 표시와공시]
            references: [K-IFRS 제1037호, 감사기준서 540]
            evidence_docs: [차종별 보증수리 실적, 리콜 진행 현황, 충당부채 설정률 산정 내역]
            priority: 1
            questions:
              - 진행 중이거나 검토 중인 리콜과 예상 비용은? 협력사 구상 금액은 별도로 인식했는가?
              - 충당부채 설정률을 최근 3년 실제 보증비용과 비교해 보았는가?
              - 협력사·보험 등에서 받을 제3자 변제자산은 회수가 사실상 확실한 경우에만 인식했는가?
      - trait_id: AUT-INCENT
        name: 판매촉진 인센티브
        stage: 판매·금융
        detect_keywords: [판매촉진, 인센티브, 판매장려금, 딜러, 할부, 리스]
        risks:
          # 공시 대조 ✅ 현대자동차: 변동대가를 기댓값·최빈값 중 더 잘 예측하는 방법으로 추정해 수익에서 차감
          - risk_id: AUT-R2
            title: 판매장려금·할부 지원의 매출 차감
            potential_risk: 딜러 판매장려금·무이자 할부 지원 등 고객에게 지급하는 대가의 매출 차감과 기말 미지급분 추정에 대한 확인 필요성이 존재
            accounts: [매출, 미지급금(판촉), 판매비]
            assertions: [정확성, 기간귀속, 표시와공시]
            references: [K-IFRS 제1115호]
            evidence_docs: [딜러 인센티브 정책, 기말 미지급 판촉비 산정 내역, 할부 지원 약정]
            priority: 1
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 15, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 늘었다. 딜러·판매법인 결제조건이 바뀌었는가?"
            questions:
              - 딜러에 주는 판매장려금은 매출에서 차감하는가, 판매비로 처리하는가? 그 판단 근거는?
              - 기말에 아직 지급하지 않은 판촉 인센티브는 어떻게 추정했는가?
      - trait_id: AUT-PRICE
        name: 부품 단가 소급 정산
        stage: 부품 조달
        detect_keywords: [단가, 소급, 원자재 연동, 협력사, 납품단가]
        risks:
          # 공시 대조 ❓ 현대자동차 공시에서 납품단가 소급 정산의 회계처리를 찾지 못함 → 2에서 3으로 낮춤
          - risk_id: AUT-R3
            title: 단가 소급분의 기간귀속
            potential_risk: 연례 단가 인하·원자재 연동으로 기말 이후 확정되는 소급 정산분을 매출·매출원가에 반영하는 기간귀속에 대한 확인 필요성이 존재
            accounts: [매출원가, 매출, 미지급금·미수금]
            assertions: [기간귀속, 정확성, 완전성]
            references: [K-IFRS 제1115호, K-IFRS 제1002호]
            evidence_docs: [단가 합의서, 기말 후 소급 정산 내역, 원자재 연동 산식]
            priority: 3
            questions:
              - 기말 현재 협상 중인 단가 인하·소급분은 얼마이고 어떻게 추정했는가?
      - trait_id: AUT-DEV
        name: 신차 개발비 자본화
        stage: 차량 개발
        detect_keywords: [개발비, 연구개발, 신차, 플랫폼, 금형]
        risks:
          # 공시 대조 ✅ 현대자동차: 판매중단·개발중단 차종의 미상각 개발비를 손상차손으로 인식 (당기·전기)
          - risk_id: AUT-R4
            title: 개발비 자본화 요건과 손상
            potential_risk: 신차·플랫폼 개발비의 자본화 요건 충족 판단과 판매 부진 차종 개발비의 손상에 대한 확인 필요성이 존재
            accounts: [개발비(무형자산), 무형자산손상차손, 연구개발비]
            assertions: [실재성, 평가와배분]
            references: [K-IFRS 제1038호, K-IFRS 제1036호]
            evidence_docs: [프로젝트별 개발비 명세, 자본화 개시 판단 자료, 차종별 판매 계획]
            priority: 2
            questions:
              - 개발비 자본화를 시작하는 시점(기술적 실현가능성)은 무엇으로 판단하는가?
              - 판매 계획보다 부진한 차종의 개발비·금형 손상검토를 했는가?

  chemical:
    name: 석유화학·정유업
    group: 제조
    review: {status: draft, note: "2026-11-15 S-Oil 2025 사업보고서와 대조·수정 (감사인 삼일). 석유화학 NCC 회사는 미확인. 승인 전"}
    summary: "원유·나프타를 정제·분해해 연료와 기초유분, 합성수지를 만드는 장치산업. 유가 변동에 따른 재고 평가, 파생상품, 설비 손상이 핵심이다"
    # 20 전체가 아니라 석유화학 계열만: 201 기초화학·202 합성수지·205 화학섬유.
    # 204(화장품·세제·도료 등)는 제외 — 에이피알·아모레퍼시픽 등 화장품 회사가 석유화학으로 분류되던 오류
    ksic_prefixes: ["19", "201", "202", "205"]
    detect_keywords: [나프타, 에틸렌, 정유, 원유, 석유화학, 합성수지, 스프레드, 정제마진, 크래커]
    profile:
      business_model:
        - 원유·나프타를 수입해 정제·분해(크래커)하고 휘발유·경유와 에틸렌·프로필렌 등을 만든다
        - 기초유분을 다시 합성수지·화학제품으로 가공해 국내외 고객에 판매한다
        - 이익은 원료와 제품 가격 차이(정제마진·스프레드)에 좌우되고 유가 변동을 파생상품으로 헤지한다
      value_chain: [원료 도입, 정제·분해, 제품 생산, 판매·수출, 정기보수·환경]
      stakeholders: [산유국·원료 트레이더, 석유제품·화학 고객사, 해운사, 환경·안전 규제기관, 금융기관]
      stage_info:
        원료 도입:
          icon: ship
          do: "원유·나프타를 장기계약과 현물로 수입한다"
          money: "회사 → 산유국·트레이더: 원료 대금(달러)"
          books: "재고자산(원료), 매입채무, 외화환산·파생상품"
        정제·분해:
          icon: flask
          do: "증류·분해 공정에서 원료를 여러 제품으로 나눈다"
          money: "연료·전력비와 설비 운영비가 든다"
          books: "결합원가 배분, 유형자산, 감가상각비"
        제품 생산:
          icon: package
          do: "기초유분을 합성수지·화학제품으로 가공한다"
          money: "가공비가 제품 원가에 쌓인다"
          books: "제품·재공품, 원가계산"
        판매·수출:
          icon: sell
          do: "국제 가격 지표에 연동해 판매하고 수출한다"
          money: "고객 → 회사: 판매대금(외화)"
          books: "매출·매출채권, 외화환산, 파생상품 손익"
        정기보수·환경:
          icon: repair
          do: "정기적으로 공정을 멈추고 보수하며 환경·안전 규제에 대응한다"
          money: "회사 → 보수 업체·정부: 보수비, 환경 비용"
          books: "수선비·자본적 지출, 복구충당부채, 배출부채"
    traits:
      - trait_id: CHM-INV
        name: 유가 변동과 재고 평가
        stage: 원료 도입
        detect_keywords: [유가, 재고평가, 래깅, 원유 가격, 순실현가능가치]
        risks:
          # 공시 대조 ✅ S-Oil: 재고자산평가 회계처리가 핵심감사사항, 원가는 선입선출법 → 유가 하락 시 평가손실 확인 필요
          - risk_id: CHM-R1
            title: 유가 하락기 재고 평가와 원가 흐름
            potential_risk: 유가 급락 시 고가 원료·제품 재고의 순실현가능가치 평가와 원가 흐름 가정에 따른 손익 변동(래깅 효과)에 대한 확인 필요성이 존재
            accounts: [재고자산, 재고자산평가손실, 매출원가]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1002호, 감사기준서 501]
            evidence_docs: [유종·제품별 재고 수불, 기말 후 판매가격, 순실현가능가치 산정표, 탱크 재고 실사 결과]
            priority: 1
            metrics:
              - name: 재고자산 회전일수
                kind: days
                num: inventory
                den: cogs
                signal: {threshold: 10, direction: up}
                question: "재고자산 회전일수가 {prev}에서 {cur}로 변동했다. 유종·제품별 재고 증감과 평가손실 반영 여부는?"
            questions:
              - 탱크·운송 중 재고의 수량은 어떻게 확인했는가(실사·검정 보고서)?
              - 유가 하락분을 순실현가능가치에 어떻게 반영했는가?
              - 선입선출법을 쓰는데 기말 직전 유가가 급락했다면, 순실현가능가치 산정에 기말 후 판매가격을 어떻게 반영했는가?
      - trait_id: CHM-DERIV
        name: 유가·환율 파생상품 헤지
        stage: 판매·수출
        detect_keywords: [파생상품, 헤지, 선물, 스왑, 위험회피]
        risks:
          # 공시 대조 ✅ S-Oil: 파생상품을 공정가치로 측정하고 위험회피회계 정책 공시
          - risk_id: CHM-R2
            title: 파생상품 공정가치와 위험회피회계
            potential_risk: 원유·제품 스왑과 통화선도의 공정가치 측정, 위험회피회계 적용 요건과 손익 표시에 대한 확인 필요성이 존재
            accounts: [파생상품자산·부채, 파생상품손익, 기타포괄손익]
            assertions: [평가와배분, 표시와공시, 실재성]
            references: [K-IFRS 제1109호, K-IFRS 제1113호, 감사기준서 540]
            evidence_docs: [파생상품 계약 명세, 거래상대방 잔액 확인, 위험회피 문서화, 공정가치 평가 보고서]
            priority: 2
            questions:
              - 위험회피회계를 적용하는 거래와 그 효과성 평가 방법은?
      - trait_id: CHM-SALES
        name: 국제 가격 연동 판매
        stage: 판매·수출
        detect_keywords: [수출, 가격 연동, 싱가포르, 판가, 공급계약]
        risks:
          # 공시 대조 ❓ S-Oil 공시에서 가격 미확정 판매의 회계처리를 찾지 못함 → 2에서 3으로 낮춤
          - risk_id: CHM-R3
            title: 가격 미확정 판매의 수익 측정
            potential_risk: 선적 이후 국제 가격 공시 평균으로 확정되는 판매(가격 미확정 계약)의 수익 측정과 기간귀속에 대한 확인 필요성이 존재
            accounts: [매출, 매출채권, 내재파생상품]
            assertions: [정확성, 기간귀속]
            references: [K-IFRS 제1115호, K-IFRS 제1109호]
            evidence_docs: [주요 수출 계약 가격 조항, 선적 서류, 기말 후 가격 확정 내역]
            priority: 3
            questions:
              - 선적 후 가격이 확정되는 거래는 기말에 어떤 가격으로 매출을 측정했는가?
      - trait_id: CHM-ASSET
        name: 설비 손상과 구조조정
        stage: 정제·분해
        detect_keywords: [가동률, 공급과잉, 구조조정, 감산, 설비 매각, 손상]
        risks:
          # 공시 대조 ❓ S-Oil(정유)에서는 설비 손상 정책만 있고 쟁점은 확인되지 않음 → 1에서 2로 낮춤.
          #   석유화학(NCC) 회사로 추가 확인이 필요
          - risk_id: CHM-R4
            title: 공급과잉 설비의 손상
            potential_risk: 중국 증설에 따른 공급과잉으로 수익성이 떨어진 공정의 손상 징후와 사용가치 가정에 대한 확인 필요성이 존재
            accounts: [유형자산, 손상차손]
            assertions: [평가와배분, 표시와공시]
            references: [K-IFRS 제1036호, 감사기준서 540]
            evidence_docs: [공정별 가동률·수익성, 현금창출단위 손상검토, 구조조정 계획]
            priority: 2
            questions:
              - 감산·가동 중단한 공정과 그 손상검토 결과는? 스프레드 가정은 외부 전망과 맞는가?

      - trait_id: CHM-RPT
        name: 대주주(산유국 국영사)로부터의 원유 도입
        stage: 원료 도입
        detect_keywords: [대주주, 원유 도입, 장기공급계약, 아람코]
        risks:
          # 공시 대조 ➕추가 S-Oil: 감사인 핵심감사사항이 '특수관계자 거래의 발생사실과 표시' — 초안에 없던 항목
          - risk_id: CHM-R5
            title: 대주주와의 원유 매입·제품 판매 거래
            potential_risk: 대주주(산유국 국영 석유사)와의 대규모 원유 매입·제품 판매 거래의 발생사실, 거래 조건, 특수관계자 공시의 완전성에 대한 확인 필요성이 존재
            accounts: [매출원가(원유), 매입채무, 매출, 특수관계자 주석]
            assertions: [발생사실, 표시와공시, 완전성]
            references: [K-IFRS 제1024호, 감사기준서 550]
            evidence_docs: [원유 장기공급계약, 특수관계자 거래 명세, 이사회 승인 내역]
            priority: 1
            questions:
              - 대주주와의 원유 매입 가격은 어떤 기준(국제 유가 지표)으로 정해지며, 시장 거래와 비교해 보았는가?
              - 특수관계자 주석의 거래 금액은 매입·매출 원장과 대사했는가?

  pharma_bio:
    name: 제약·바이오
    group: 헬스케어
    review: {status: draft, note: "2026-11-15 유한양행 2025 사업보고서와 대조 (감사인 삼일). 3개 항목 모두 공시로 확인. 승인 전"}
    summary: "오랜 연구·임상을 거쳐 허가받은 의약품을 팔거나 기술을 이전해 수익을 내는 산업. 개발비 자본화, 기술이전 수익, 리베이트·반품이 핵심이다"
    ksic_prefixes: ["21", "701"]
    detect_keywords: [임상, 신약, 의약품, 바이오, 기술이전, 품목허가, 파이프라인, 바이오시밀러, CDMO]
    profile:
      business_model:
        - 신약 후보물질을 연구하고 임상 1~3상을 거쳐 품목허가를 받아 판매한다
        - 개발 중인 물질을 글로벌 제약사에 기술이전하고 계약금·마일스톤·로열티를 받는다
        - 병·의원·약국으로 도매상을 거쳐 유통하며 약가는 정부가 정한다
      value_chain: [연구·임상, 인허가, 생산, 유통·판매, 기술이전·로열티]
      stakeholders: [병·의원·약국, 의약품 도매상, 식약처·건강보험심사평가원, 글로벌 제약사(기술이전 상대), 임상시험수탁기관(CRO)]
      stage_info:
        연구·임상:
          icon: flask
          do: "후보물질을 찾고 사람 대상 임상시험을 단계별로 진행한다"
          money: "회사 → CRO·병원: 임상 비용"
          books: "연구비·경상개발비, 개발비 자본화 판단"
        인허가:
          icon: bid
          do: "식약처·FDA에 품목허가를 신청하고 약가를 협상한다"
          money: "허가 전에는 매출 없이 비용만 나간다"
          books: "자본화 요건(허가 가능성) 판단의 기준점"
        생산:
          icon: pill
          do: "GMP 공장에서 의약품을 생산하거나 위탁생산(CDMO)한다"
          money: "회사 → 원료사: 원료의약품 대금"
          books: "재고자산(유효기간 관리), 유형자산"
        유통·판매:
          icon: truck
          do: "도매상을 거쳐 병·의원·약국에 공급하고 판촉한다"
          money: "도매상 → 회사: 판매대금 / 회사 → 거래처: 할인·반품 정산"
          books: "매출(반품·할인 차감), 매출채권, 판매촉진비"
        기술이전·로열티:
          icon: royalty
          do: "개발 중인 물질의 권리를 글로벌 제약사에 넘기고 단계별로 대가를 받는다"
          money: "상대 제약사 → 회사: 계약금·마일스톤·로열티"
          books: "라이선스 수익, 계약부채, 반환 조건"
    traits:
      - trait_id: PHA-DEV
        name: 임상 단계 개발비
        stage: 연구·임상
        detect_keywords: [임상, 개발비, 자본화, 파이프라인, 후보물질]
        risks:
          # 공시 대조 ✅ 유한양행: 핵심감사사항 '렉라자 개발비 손상 검토', 개발비는 기술적 실현가능성 등 요건 충족 이후 지출만 자산화
          - risk_id: PHA-R1
            title: 개발비 자본화 요건과 손상
            potential_risk: 임상 단계별 개발비 자본화 요건(기술적 실현가능성) 충족 판단과 임상 실패·중단 품목 개발비의 손상에 대한 확인 필요성이 존재
            accounts: [개발비(무형자산), 경상개발비, 무형자산손상차손]
            assertions: [실재성, 평가와배분, 표시와공시]
            references: [K-IFRS 제1038호, K-IFRS 제1036호, 감사기준서 540]
            evidence_docs: [파이프라인별 임상 단계와 자본화 내역, 임상 결과 보고, 손상검토]
            priority: 1
            questions:
              - 어느 임상 단계부터 자본화하는가? 업계 관행(통상 3상 이후·허가 신청)과 다르다면 근거는?
              - 임상을 중단하거나 결과가 나빴던 품목의 개발비는 어떻게 처리했는가?
              - 허가·출시된 신약의 개발비는 예상 매출(시장 점유·약가) 가정에 따라 손상 여부가 갈리는데, 그 가정은 어떤 자료에 근거하는가?
      - trait_id: PHA-LICENSE
        name: 기술이전 계약
        stage: 기술이전·로열티
        detect_keywords: [기술이전, 라이선스, 마일스톤, 계약금, 로열티, 반환]
        risks:
          # 공시 대조 ✅ 유한양행: 기술이전 수익을 계약금·마일스톤·로열티로 구분, 계약금은 수행의무에 따라 일시 또는 기간에 걸쳐 인식
          - risk_id: PHA-R2
            title: 기술이전 수익의 인식 시점과 측정
            potential_risk: 기술이전 계약금·마일스톤의 수행의무 식별, 반환 조건이 있는 대가와 변동대가 추정에 따른 수익인식 시점에 대한 확인 필요성이 존재
            accounts: [라이선스 수익, 계약부채, 매출채권]
            assertions: [발생사실, 기간귀속, 정확성]
            references: [K-IFRS 제1115호]
            evidence_docs: [기술이전 계약서, 마일스톤 달성 근거, 반환 조건 검토 메모]
            priority: 1
            questions:
              - 계약금에 반환 조건이 있는가? 한 시점과 기간 중 어떤 방식으로 수익을 인식했는가?
              - 기말 전후 달성된 마일스톤의 근거 자료(상대방 통지 등)는?
      - trait_id: PHA-RETURN
        name: 반품·할인과 리베이트
        stage: 유통·판매
        detect_keywords: [반품, 할인, 판매촉진, 약가, 도매상, 리베이트]
        risks:
          # 공시 대조 ✅ 유한양행: 결제할인·판매장려금을 매출 발생 시점에 추정해 수익에서 차감, 계약부채 인식
          - risk_id: PHA-R3
            title: 반품·할인 추정과 판매촉진비
            potential_risk: 유효기간 경과·약가 인하에 따른 반품과 할인(변동대가) 추정, 판매촉진비 지출의 적정성(불법 리베이트 위험)에 대한 확인 필요성이 존재
            accounts: [매출, 환불부채, 판매촉진비, 재고자산]
            assertions: [정확성, 발생사실, 완전성]
            references: [K-IFRS 제1115호, 감사기준서 240, 감사기준서 250]
            evidence_docs: [반품 실적과 환불부채 산정, 약가 인하 내역, 판매촉진비 집행 증빙]
            priority: 2
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 20, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 늘었다. 도매상 결제조건 변화와 기말 밀어내기 매출은 없는가?"
            questions:
              - 반품 충당(환불부채) 설정률은 과거 반품 실적과 맞는가?
              - 판매촉진비의 집행 대상과 증빙은 어떻게 관리하는가?

  telecom:
    name: 통신업
    group: 정보통신
    review: {status: draft, note: "2026-11-15 SK텔레콤 2025 사업보고서와 대조·수정 (감사인 삼정). 승인 전"}
    summary: "주파수와 통신망에 크게 투자하고 가입자에게 매달 요금을 받는 산업. 결합상품 수익 배분, 가입자 획득비용, 주파수·망 자산이 핵심이다"
    ksic_prefixes: ["612"]
    detect_keywords: [가입자, 이동통신, 5G, 주파수, ARPU, 무선, 유선, 초고속인터넷, IPTV]
    profile:
      business_model:
        - 정부에서 주파수를 할당받고 기지국·유선망을 깔아 이동통신·인터넷·IPTV 서비스를 판다
        - 단말기 할인과 약정으로 가입자를 모으고 매달 요금을 받는다
        - 통신을 기반으로 미디어·클라우드·데이터센터 등 신사업으로 넓힌다
      value_chain: [망 투자, 가입자 모집, 서비스 제공·과금, 신사업·콘텐츠]
      stakeholders: [가입자, 대리점·판매점, 단말기 제조사, 과학기술정보통신부·방송통신위원회, 콘텐츠 사업자]
      stage_info:
        망 투자:
          icon: tower
          do: "주파수를 할당받고 기지국·광케이블 망을 구축한다"
          money: "회사 → 정부·장비사: 주파수 대가, 설비투자"
          books: "주파수이용권(무형자산), 유형자산, 감가상각·상각비"
        가입자 모집:
          icon: contract
          do: "대리점에서 단말 할인과 약정으로 가입자를 모은다"
          money: "회사 → 대리점: 판매수수료 / 고객 → 회사: 단말 대금(할부)"
          books: "계약원가(가입자 획득비용) 자산화, 장기 할부채권"
        서비스 제공·과금:
          icon: invoice
          do: "통신 서비스를 제공하고 매달 요금을 청구한다"
          money: "가입자 → 회사: 월 요금"
          books: "매출(요금·결합할인 배분), 매출채권, 대손"
        신사업·콘텐츠:
          icon: code
          do: "IPTV·클라우드·데이터센터 등 신사업에 투자한다"
          money: "회사 → 콘텐츠사·설비: 콘텐츠 비용, 데이터센터 투자"
          books: "콘텐츠 무형자산, 관계기업 투자, 손상"
    traits:
      - trait_id: TEL-BUNDLE
        name: 단말·요금 결합 판매
        stage: 서비스 제공·과금
        detect_keywords: [결합, 약정, 단말기, 할부, 요금할인, 선택약정]
        risks:
          # 공시 대조 ✅ SK텔레콤: 단말기·무선통신 결합 시 상대적 개별 판매가격으로 거래가격 배분, 단말기분 계약자산 인식
          - risk_id: TEL-R1
            title: 결합상품 거래가격 배분
            potential_risk: 단말기와 통신 서비스를 묶어 할인 판매할 때 수행의무별 거래가격 배분과 할인 효과의 수익인식 시점에 대한 확인 필요성이 존재
            accounts: [매출(서비스·단말), 계약자산·계약부채]
            assertions: [정확성, 기간귀속, 표시와공시]
            references: [K-IFRS 제1115호, 감사기준서 315]
            evidence_docs: [요금제·결합상품별 배분 정책, 빌링 시스템 IT 통제 평가, 계약자산 계산 내역]
            priority: 1
            questions:
              - 단말 할인과 결합 할인을 수행의무별로 어떻게 배분하는가? 개별 판매가격은 어떻게 정했는가?
              - 빌링 시스템의 요금 계산 로직 변경은 어떻게 통제되는가?
      - trait_id: TEL-SAC
        name: 가입자 획득비용
        stage: 가입자 모집
        detect_keywords: [판매수수료, 마케팅, 가입자 유치, 계약원가, 지원금]
        risks:
          # 공시 대조 ✅ SK텔레콤: '계약체결 증분원가의 내용연수 추정'을 유의적 추정으로 공시
          - risk_id: TEL-R2
            title: 계약원가 자산화와 상각
            potential_risk: 대리점 판매수수료 등 가입자 획득 증분원가의 자산화 범위와 상각 기간(예상 가입 기간) 추정에 대한 확인 필요성이 존재
            accounts: [계약원가(선급비용), 판매수수료, 상각비]
            assertions: [평가와배분, 실재성, 정확성]
            references: [K-IFRS 제1115호, 감사기준서 540]
            evidence_docs: [수수료 정책, 자산화 대상 수수료 명세, 가입자 이탈률 자료]
            priority: 2
            questions:
              - 자산화하는 수수료와 바로 비용 처리하는 수수료의 구분 기준은?
              - 상각 기간은 실제 가입 유지 기간과 맞는가?
      - trait_id: TEL-NET
        name: 주파수·망 투자
        stage: 망 투자
        detect_keywords: [주파수, 기지국, 설비투자, CAPEX, 망 구축, 5G]
        risks:
          # 공시 대조 ✅ SK텔레콤: 유·무형자산 내용연수 추정을 유의적 추정으로 공시
          - risk_id: TEL-R3
            title: 주파수이용권·망 설비의 상각과 손상
            potential_risk: 주파수이용권 상각 개시 시점과 내용연수, 기술 전환(3G·LTE 종료)에 따른 망 설비 손상과 철거 비용에 대한 확인 필요성이 존재
            accounts: [주파수이용권, 유형자산, 감가상각비, 복구충당부채]
            assertions: [평가와배분, 실재성, 완전성]
            references: [K-IFRS 제1038호, K-IFRS 제1016호, K-IFRS 제1036호]
            evidence_docs: [주파수 할당 조건, 설비 대장과 실사, 기술 전환 계획]
            priority: 2
            metrics:
              - name: 유형자산 증가율 − 매출 증가율
                kind: growth_gap
                num: ppe
                den: revenue
                signal: {threshold: 8, direction: up}
                question: "{cur_year}년 유형자산 증가율이 매출 증가율보다 {cur} 높다. 망 투자 계획과 회수 가정은?"
            questions:
              - 서비스를 종료할 망 설비의 잔존 장부금액과 철거 비용은?

      - trait_id: TEL-BILL
        name: 대량 소액 거래의 과금 시스템 의존
        stage: 서비스 제공·과금
        detect_keywords: [과금, 빌링, 요금, 가입자]
        risks:
          # 공시 대조 ➕추가 SK텔레콤: 감사인 핵심감사사항이 '무선통신매출의 실재성 및 정확성' — 초안에 없던 항목
          - risk_id: TEL-R4
            title: 무선통신매출의 실재성과 정확성 (과금 시스템)
            potential_risk: 수많은 가입자·요금제의 매출이 과금(빌링) 시스템에서 자동 계산되므로, 시스템 통제와 요금제 반영의 정확성에 대한 확인 필요성이 존재
            accounts: [매출(무선통신), 매출채권]
            assertions: [발생사실, 정확성]
            references: [K-IFRS 제1115호, 감사기준서 315, 감사기준서 330]
            evidence_docs: [과금 시스템 IT 일반통제 평가, 요금제 변경 승인 내역, 과금 데이터와 총계정원장 대사]
            priority: 1
            questions:
              - 요금제 신설·변경이 과금 시스템에 반영될 때 누가 승인하고 검증하는가?
              - 과금 시스템의 매출 데이터와 총계정원장 매출을 매월 대사하는가? 차이는 어떻게 처리하는가?

  banking:
    name: 은행·금융지주
    group: 금융
    review: {status: draft, note: "2026-11-15 KB금융 2025 사업보고서와 대조·수정 (감사인 삼일). 승인 전"}
    summary: "예금과 채권으로 자금을 모아 대출·투자로 운용하고 이자와 수수료를 버는 산업. 대손충당금(기대신용손실), 금융상품 공정가치, IT 통제가 핵심이다"
    ksic_prefixes: ["641"]   # 지주회사(64992)는 금융·비금융이 섞여 있어 본문으로 판별 (pipeline.resolve_industry)
    detect_keywords: [대출채권, 예수부채, 순이자마진, NIM, 기대신용손실, 고정이하여신, BIS, 자기자본비율, 여신]
    profile:
      business_model:
        - 예금·채권 발행으로 자금을 조달하고 기업·가계에 대출해 이자 차이(예대마진)를 번다
        - 유가증권 투자와 외환·파생상품 거래, 펀드·방카슈랑스 판매 수수료로 비이자이익을 낸다
        - 자본적정성(BIS 비율)과 건전성 규제 안에서 자산을 늘린다
      value_chain: [자금 조달, 여신 심사·실행, 자금 운용·투자, 이자·수수료 수익, 리스크 관리·충당금]
      stakeholders: [예금자, 대출 고객(기업·가계), 금융감독원·한국은행, 신용평가사, 지주사·계열사]
      stage_info:
        자금 조달:
          icon: bank
          do: "예금을 받고 은행채를 발행해 자금을 모은다"
          money: "예금자 → 은행: 예금 / 은행 → 예금자: 이자"
          books: "예수부채, 차입부채·사채, 이자비용"
        여신 심사·실행:
          icon: contract
          do: "차주의 신용을 심사하고 대출을 실행한다"
          money: "은행 → 차주: 대출금"
          books: "대출채권(상각후원가), 이연대출부대수익·비용"
        자금 운용·투자:
          icon: royalty
          do: "남는 자금을 채권·주식·파생상품에 투자한다"
          money: "은행 → 시장: 유가증권 매입"
          books: "당기손익·기타포괄손익 공정가치 측정 금융자산, 파생상품"
        이자·수수료 수익:
          icon: invoice
          do: "대출 이자와 각종 수수료를 받는다"
          money: "차주·고객 → 은행: 이자, 수수료"
          books: "이자수익(유효이자율), 수수료수익"
        리스크 관리·충당금:
          icon: test
          do: "부실 가능성을 평가해 충당금을 쌓고 자본비율을 관리한다"
          money: "부실 대출은 상각·매각으로 정리한다"
          books: "대손충당금(기대신용손실), 대손상각비"
    traits:
      - trait_id: BNK-ECL
        name: 기대신용손실 충당금
        stage: 리스크 관리·충당금
        detect_keywords: [기대신용손실, 대손충당금, 고정이하여신, 연체율, 부실채권, 미래전망정보]
        risks:
          # 공시 대조 ✅ KB금융: 핵심감사사항 '상각후원가측정 대출채권의 기대신용손실 충당금' — 개별평가 현금흐름·집합평가 모형 가정
          - risk_id: BNK-R1
            title: 대출채권 기대신용손실 측정
            potential_risk: 신용위험 단계 구분(Stage 1~3), 부도율·부도시손실률 모형과 미래전망정보·경영진 조정(오버레이)에 따른 충당금 추정의 불확실성에 대한 확인 필요성이 존재
            accounts: [대출채권, 대손충당금, 대손상각비]
            assertions: [평가와배분, 완전성, 표시와공시]
            references: [K-IFRS 제1109호, 감사기준서 540, 감사기준서 315]
            evidence_docs: [기대신용손실 모형 문서·검증 보고서, 단계 구분 기준과 이동 내역, 경영진 조정 근거, 개별평가 대상 차주 명세]
            priority: 1
            questions:
              - 신용위험이 유의적으로 증가했다고 보는 기준(Stage 2 이동)은 무엇인가?
              - 미래전망정보 시나리오와 가중치, 경영진 조정(오버레이)의 근거는?
              - 부동산 PF 등 집중 업종의 개별평가 결과는?
      - trait_id: BNK-FV
        name: 공정가치 측정 금융상품
        stage: 자금 운용·투자
        detect_keywords: [공정가치, 파생상품, 수준3, 유가증권, 평가모형]
        risks:
          # 공시 대조 ✅ KB금융: 수준3 금융상품을 외부 평가사·내부 모형으로 평가, 민감도 공시
          - risk_id: BNK-R2
            title: 수준 3 금융상품 공정가치
            potential_risk: 시장가격이 없는 비상장 지분·구조화 상품·파생상품의 평가모형과 관측 불가능한 투입변수에 대한 확인 필요성이 존재
            accounts: [당기손익공정가치측정금융자산, 파생상품자산·부채, 평가손익]
            assertions: [평가와배분, 표시와공시]
            references: [K-IFRS 제1113호, K-IFRS 제1109호, 감사기준서 540]
            evidence_docs: [수준별 공정가치 명세, 외부 평가기관 보고서, 독립 가격검증 결과]
            priority: 1
            questions:
              - 수준 3으로 분류된 상품과 핵심 투입변수(할인율·변동성)의 민감도는?
      - trait_id: BNK-FEE
        name: 수수료수익과 IT 통제
        stage: 이자·수수료 수익
        detect_keywords: [수수료수익, 방카슈랑스, 신탁, 전산, 계정계, 유효이자율]
        risks:
          # 공시 대조 ❓ KB금융 공시에서 이자·수수료 수익의 IT 의존 관련 쟁점을 찾지 못함 → 2에서 3으로 낮춤
          - risk_id: BNK-R3
            title: 이자·수수료 수익 계산의 IT 의존
            potential_risk: 대량 거래가 계정계 시스템에서 자동 계산되므로 유효이자율 적용과 수수료수익 인식(판매 수수료 1115)의 정확성이 IT 일반통제에 의존하는 데 대한 확인 필요성이 존재
            accounts: [이자수익, 수수료수익, 이연대출부대수익]
            assertions: [정확성, 발생사실, 완전성]
            references: [K-IFRS 제1115호, K-IFRS 제1109호, 감사기준서 315]
            evidence_docs: [계정계 시스템 IT 일반통제 평가, 이자 계산 재계산 표본, 수수료 계약 조건]
            priority: 3
            questions:
              - 이자 계산 로직이나 금리 변경은 누가 승인하고 어떻게 검증하는가?
              - 펀드·보험 판매 수수료 중 사후 환수 조건이 있는 금액은 어떻게 처리하는가?

      - trait_id: BNK-INS
        name: 금융지주 내 보험 자회사
        stage: 리스크 관리·충당금
        detect_keywords: [보험계약부채, 보험계약마진, 손해율, 보험 자회사]
        risks:
          # 공시 대조 ➕추가 KB금융: 감사인 핵심감사사항에 '보험계약 이행현금흐름 산출 시 적용된 손해율 가정' — 초안에 없던 항목
          - risk_id: BNK-R4
            title: 보험 자회사 보험계약부채의 가정
            potential_risk: 금융지주 연결에 포함된 보험 자회사의 보험계약부채(이행현금흐름) 산출에 쓰인 손해율·해지율 등 가정에 대한 확인 필요성이 존재
            accounts: [보험계약부채, 보험서비스비용]
            assertions: [평가와배분, 정확성]
            references: [K-IFRS 제1117호, 감사기준서 540]
            evidence_docs: [계리 가정 설정 보고서, 실제 손해율과 가정 비교(경험 분석), 계리 전문가 검토 결과]
            priority: 2
            questions:
              - 손해율 가정은 과거 몇 년의 경험 실적에 근거하며, 당기에 가정을 바꿨는가?
              - 가정 변경이 보험계약마진과 당기손익에 미친 영향은?

