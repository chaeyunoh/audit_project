# 산업 특성 → 잠재적 감사 검토 영역 지식베이스 (Risk Mapping의 유일한 근거)
#
# 원칙
#  - AI는 아래 trait_id 중 '어떤 특성이 회사에 해당하는지'만 제안할 수 있다.
#  - 계정과목·경영진 주장·확인 질문의 기본 세트는 사람이 검토한 이 파일에서만 나온다.
#  - 문구는 '결론'이 아니라 '확인 필요성'으로 작성한다.
#  - 이 파일 수정 시 kb_version을 올리고 변경 사유를 CHANGELOG에 남긴다.
kb_version: "2026.11-7"  # 11-7 석유화학·철강 업종코드 범위 축소 / 11-6 9개 산업 공시 대조 수정 / 11-5 백화점·2차전지 공시 대조 수정 / 11-4 산업 9개 추가(초안)·업종 일반 가치사슬 / 11-1 재무 지표 / 11-2 550·570·510 / 11-3 백화점·면세, 2차전지(초안)

assertion_glossary:
  발생사실: 기록된 거래가 실제로 발생했는가 (Occurrence)
  완전성: 기록되어야 할 거래·잔액이 모두 기록되었는가 (Completeness)
  정확성: 금액이 정확히 기록되었는가 (Accuracy)
  기간귀속: 올바른 회계기간에 기록되었는가 (Cut-off)
  실재성: 자산·부채가 실제로 존재하는가 (Existence)
  평가와배분: 적절한 금액으로 평가되었는가 (Valuation & Allocation)
  권리와의무: 회사가 권리·의무를 보유하는가 (Rights & Obligations)
  표시와공시: 적절히 분류·공시되었는가 (Presentation & Disclosure)

# 감사기준상 산업과 무관하게 항상 고려되는 영역 (산업 판단과 분리해 표시)
baseline_risks:
  - risk_id: G-REV
    title: 수익인식 관련 부정위험의 추정
    trait: 감사기준서 240은 수익인식에 부정위험이 존재한다고 추정하도록 요구
    potential_risk: 수익인식과 관련한 부정위험 추정의 반박 가능 여부 검토 필요
    accounts: [매출, 매출채권]
    assertions: [발생사실, 기간귀속]
    references: [감사기준서 240]
    evidence_docs: [수익인식 회계정책, 기말 전후 매출 거래 내역, 주요 계약서]
    metrics:
      - name: 매출채권 증가율 − 매출 증가율
        kind: growth_gap
        num: receivables
        den: revenue
        signal: {threshold: 15, direction: up}
        question: "{cur_year}년 매출채권 증가율이 매출 증가율보다 {cur} 높다. 기말 전후 매출 중 회수되지 않은 거래의 내용과 회수 조건은?"
    priority: 2
    questions:
      - 회사의 주요 수익 유형별 수익인식 시점은 언제인가?
      - 기말 전후로 비경상적으로 큰 매출 또는 반품이 있었는가?
  - risk_id: G-MO
    title: 경영진의 통제 무력화 위험
    trait: 감사기준서 240은 모든 기업에서 경영진 통제 무력화 위험을 고려하도록 요구
    potential_risk: 분개·회계추정·비경상 거래를 통한 통제 무력화 가능성 검토 필요
    accounts: [전 계정 (분개 테스트)]
    assertions: [발생사실, 정확성]
    references: [감사기준서 240]
    evidence_docs: [수기 분개 목록, 결산 조정 분개, 주요 회계추정 변경 내역]
    priority: 2
    questions:
      - 결산 시 수기로 입력된 분개의 승인 절차는 무엇인가?
      - 당기 중 회계추정이나 회계정책의 변경이 있었는가?

  - risk_id: G-RP
    title: 특수관계자 거래 식별의 완전성
    trait: 감사기준서 550은 특수관계자와 그 거래의 식별·공시를 모든 감사에서 다루도록 요구
    potential_risk: 특수관계자 거래의 식별 누락 또는 공시 불일치 가능성에 대한 확인 필요성이 존재
    accounts: [특수관계자 거래 주석, 관련 채권·채무]
    assertions: [완전성, 표시와공시]
    references: [감사기준서 550, K-IFRS 제1024호]
    evidence_docs: [경영진이 작성한 특수관계자 목록, 이사회 의사록, 대주주 등과의 거래 내역, 거래 계약서]
    priority: 2
    questions:
      - 경영진이 관리하는 특수관계자 목록과 당기 중 변동 내역은?
      - 정상적인 거래 과정을 벗어난 특수관계자 거래(자금대여, 담보제공 등)가 있었는가?

# 계획 중요성 (감사기준서 320) — 도구는 '제안'만 하고, 기준과 비율은 감사인이 정한다.
# 비율은 실무에서 흔히 쓰는 범위의 예시값이다. 실제 적용은 소속 법인의 방법론을 따른다.
materiality:
  benchmarks:
    - {key: pretax_income, name: 법인세비용차감전순이익, pct: 5, range: "3~10%", note: 이익을 중시하는 영리기업의 일반적 기준}
    - {key: revenue, name: 매출, pct: 1, range: "0.5~2%", note: 이익이 손실이거나 변동이 클 때 대안}
    - {key: total_assets, name: 자산총계, pct: 1, range: "0.5~2%", note: 자산 중심 기업(금융·지주 등)}
    - {key: total_equity, name: 자본총계, pct: 2, range: "1~5%", note: 순자산이 주된 관심사일 때}
  performance_pct: {normal: 75, higher_risk: 50}   # 초도감사·계속기업 신호 등 위험이 높으면 낮춘다
  trivial_pct: 5                                   # 명백히 사소한 금액 = 계획 중요성의 5% (예시)
  volatility_limit: 50                             # 세전이익이 전년 대비 이 비율(%) 이상 변하면 매출 기준을 제안 (휴리스틱)

# 조건이 충족될 때만 Risk Map에 추가되는 영역
conditional_risks:
  going_concern:
    thresholds: {debt_warn: 200, debt_danger: 400}   # 산업별 차이가 큼(건설은 높게 형성) — 수준 판정 참고값
    risk:
      risk_id: G-GC
      title: 계속기업 가정 관련 사건·상황 검토
      trait: 재무 지표에서 감사기준서 570이 예시하는 재무적 사건·상황이 관찰됨
      potential_risk: 계속기업 가정에 유의적 의문을 제기할 수 있는 사건·상황의 존재 여부에 대한 확인 필요성이 존재
      accounts: [차입금, 유동성, 계속기업 관련 주석]
      assertions: [표시와공시, 평가와배분]
      references: [감사기준서 570, K-IFRS 제1001호]
      evidence_docs: [경영진의 계속기업 평가 자료, 향후 12개월 자금수지 계획, 차입약정 및 재무약정 준수 내역]
      priority: 1
      questions:
        - 경영진은 보고기간말로부터 최소 12개월에 대한 계속기업 평가를 수행했는가? 그 가정은?
        - 차입약정의 재무약정(부채비율 등) 위반 또는 만기 연장 협의가 있었는가?
  first_year:
    risk:
      risk_id: G-OB
      title: 초도감사 기초잔액
      trait: 초도감사에서는 전기 감사인의 감사 결과와 기초잔액을 별도로 확인해야 함
      potential_risk: 기초잔액이 당기 재무제표를 중요하게 왜곡시키는지와 회계정책의 일관성에 대한 확인 필요성이 존재
      accounts: [기초잔액 전반]
      assertions: [실재성, 완전성, 평가와배분]
      references: [감사기준서 510, 감사기준서 300]
      evidence_docs: [전기 감사보고서, 전기 감사인 조서 열람 결과, 전기말 시산표]
      priority: 1
      questions:
        - 전기 감사인의 감사보고서에 변형의견 또는 강조사항이 있었는가?
        - 전기 감사인과의 커뮤니케이션 및 조서 열람이 가능한가?


# 업종 일반 가치사슬 — 지식베이스에 없는 업종(KSIC)도 오프라인에서 가치사슬로 읽을 수 있게 하는 대분류 템플릿.
