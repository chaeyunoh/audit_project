            title: 본인·대리인 판단과 매출 표시
            potential_risk: 커머스·광고·결제 거래에서 회사가 본인인지 대리인인지에 따라 매출을 총액 또는 순액으로 표시하는 판단과 대량 거래의 정확성에 대한 확인 필요성이 존재
            accounts: [매출, 매출원가, 매출채권]
            assertions: [표시와공시, 발생사실, 정확성]
            references: [K-IFRS 제1115호, 감사기준서 315]
            evidence_docs: [서비스별 본인·대리인 판단 메모, 거래 데이터와 정산 대사, 매출 시스템 IT 통제]
            priority: 1
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 15, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 변동했다. 광고·정산 대행사 회수조건 변화는?"
            questions:
              - 서비스별로 회사가 재화·서비스를 통제하는지(본인) 판단한 근거는?
              - 결제·거래 데이터와 매출 계상액을 어떻게 대사하는가?
              - 커머스 판매수수료는 어떤 시스템에서 계산되며, 결제 데이터와 수익 인식 금액을 어떻게 대사하는가?
      - trait_id: PLT-POINT
        name: 포인트·충전금·선불 결제
        stage: 결제·정산
        detect_keywords: [포인트, 충전금, 선불, 캐시, 고객예치금, 미사용]
        risks:
          # 공시 대조 ✅ NAVER: 계약부채(선수금·선수수익·예수금)를 기타부채로 표시
          - risk_id: PLT-R2
            title: 충전금·포인트 부채와 미사용분 수익
            potential_risk: 이용자 충전금·포인트·게임 재화의 부채 완전성과 미사용 예상분(낙전) 수익인식, 이용자 자금의 별도 관리에 대한 확인 필요성이 존재
            accounts: [선수금·계약부채, 예수금, 매출]
            assertions: [완전성, 기간귀속, 권리와의무]
            references: [K-IFRS 제1115호, 전자금융거래법]
            evidence_docs: [충전·사용·소멸 데이터, 낙전 추정 근거, 이용자 자금 보호(신탁·보증) 현황]
            priority: 2
            questions:
              - 미사용 포인트·충전금의 수익인식 방식과 낙전률 근거는?
              - 이용자 선불 충전금은 외부 신탁 등으로 보호되는가?
      - trait_id: PLT-MNA
        name: 잦은 인수합병과 영업권
        stage: 콘텐츠·M&A 투자
        detect_keywords: [인수, 합병, 영업권, 지분 취득, 종속기업, 관계기업, 손상]
        risks:
          # 공시 대조 ✅ NAVER: 핵심감사사항 '영업권 손상평가', '관계기업투자주식 손상평가'
          - risk_id: PLT-R3
            title: 영업권·무형자산 손상과 사업결합 회계
            potential_risk: 성장 기대로 높은 가격에 인수한 회사의 영업권·무형자산 손상과 매수가격 배분, 지배력 판단에 대한 확인 필요성이 존재
            accounts: [영업권, 무형자산, 관계기업투자, 손상차손]
            assertions: [평가와배분, 표시와공시, 실재성]
            references: [K-IFRS 제1103호, K-IFRS 제1036호, K-IFRS 제1110호, 감사기준서 540]
            evidence_docs: [매수가격 배분 보고서, 현금창출단위별 손상검토, 피인수회사 사업계획 대비 실적]
            priority: 1
            questions:
              - 손상검토의 매출 성장률·할인율 가정은 피인수회사의 실제 실적과 맞는가?
              - 당기 인수 거래의 매수가격 배분에서 식별한 무형자산은?
              - 관계기업투자(지분법)의 손상징후는 무엇으로 판단했고, 회수가능액 추정의 가정은?

  shipbuilding:
    name: 조선업
    group: 제조
    review: {status: draft, note: "2026-11-15 HD현대중공업 2025 사업보고서와 대조·수정 (감사인 삼정). 승인 전"}
    summary: "선주와 수년짜리 건조계약을 맺고 진행률로 수익을 인식하는 수주산업. 총예정원가 추정, 공사손실충당부채, 환헤지와 선수금 환급보증이 핵심이다"
    ksic_prefixes: ["311"]
    detect_keywords: [선박, 조선, 건조, 수주잔고, 선주, LNG선, 해양플랜트, 인도, 헤비테일]
    profile:
      business_model:
        - 선주와 선박 건조계약을 맺고 2~3년에 걸쳐 설계·건조해 인도한다
        - 대금은 단계별로 받고(인도 시 많이 받는 헤비테일 구조) 달러 수주가 많아 환헤지를 한다
        - 은행이 선수금 환급보증(RG)을 서 주어야 수주할 수 있다
      value_chain: [수주, 설계, 건조, 인도, 보증수리]
      stakeholders: [해외 선주·해운사, 조선기자재 협력사, 사내 협력업체, 금융기관(RG 발급), 선급]
      stage_info:
        수주:
          icon: contract
          do: "선주와 선가·인도일·지체상금 조건으로 건조계약을 맺는다"
          money: "선주 → 회사: 계약금(선수금) / 은행: 선수금 환급보증"
          books: "계약 조건이 수익인식·손실부담 판단의 기초, 계약부채"
        설계:
          icon: design
          do: "기본·상세 설계를 하고 기자재를 발주한다"
          money: "회사 → 설계·기자재사: 설계비, 기자재 선급금"
          books: "총예정원가 최초 추정, 선급금"
        건조:
          icon: ship
          do: "블록을 만들어 도크에서 조립·탑재하고 시운전한다"
          money: "회사 → 협력사·자재사: 인건비·강재비"
          books: "투입원가 기준 진행률, 계약자산(미청구공사)"
        인도:
          icon: complete
          do: "선주에게 배를 인도하고 잔금을 받는다"
          money: "선주 → 회사: 인도 대금(헤비테일), 지체 시 지체상금 차감"
          books: "매출채권, 계약자산 정산, 외화환산·파생상품 정산"
        보증수리:
          icon: repair
          do: "인도 후 보증기간 동안 결함을 수리한다"
          money: "회사 → 선주·수리업체: 보증수리비"
          books: "하자보수충당부채"
    traits:
      - trait_id: SHP-COST
        name: 총예정원가와 진행률
        stage: 건조
        detect_keywords: [총예정원가, 진행률, 강재, 후판, 원가 상승, 공사손실, 인건비]
        risks:
          # 공시 대조 ✅ HD현대중공업: 핵심감사사항 '총 계약원가 추정의 불확실성', '산정된 공사진행률의 적정성' — 환율·강재가격·생산공수 변동
          - risk_id: SHP-R1
            title: 총예정원가 추정과 공사손실충당부채
            potential_risk: 강재 가격·인건비 상승과 공정 지연을 반영한 호선별 총예정원가 추정, 진행률 측정과 손실 예상 호선의 공사손실충당부채에 대한 확인 필요성이 존재
            accounts: [매출, 계약자산, 매출원가, 공사손실충당부채]
            assertions: [평가와배분, 정확성, 완전성]
            references: [K-IFRS 제1115호, K-IFRS 제1037호, 감사기준서 540]
            evidence_docs: [호선별 실행예산과 변경 내역, 공정률 보고, 손실 예상 호선 목록]
            priority: 1
            metrics:
              - name: 계약자산 ÷ 매출
                kind: ratio
                num: contract_assets
                den: revenue
                signal: {threshold: 5, direction: up}
                question: "계약자산 ÷ 매출이 {prev}에서 {cur}로 변동했다({change}). 청구가 늦어진 호선과 헤비테일 조건은?"
              - name: 매출원가율
                kind: ratio
                num: cogs
                den: revenue
                signal: {threshold: 3, direction: both}
                question: "매출원가율이 {prev}에서 {cur}로 변동했다({change}). 총예정원가가 크게 바뀐 호선은?"
            questions:
              - 총예정원가 변경이 큰 호선과 그 사유(강재·인건비·설계 변경)는?
              - 공정 지연으로 지체상금이 예상되는 호선과 변동대가 반영 여부는?
      - trait_id: SHP-FX
        name: 달러 수주와 환헤지
        stage: 수주
        detect_keywords: [환헤지, 선물환, 파생상품, 외화, 달러, 위험회피]
        risks:
          # 공시 대조 ✅ HD현대중공업: 통화선도를 위험회피수단으로 지정, 공정가치·현금흐름 위험회피회계 적용
          - risk_id: SHP-R2
            title: 선물환 공정가치와 확정계약 위험회피
            potential_risk: 장기 달러 수주에 대한 선물환 계약의 공정가치 측정과 확정계약 위험회피회계 적용의 적정성에 대한 확인 필요성이 존재
            accounts: [파생상품자산·부채, 확정계약자산·부채, 파생상품손익]
            assertions: [평가와배분, 표시와공시]
            references: [K-IFRS 제1109호, K-IFRS 제1113호]
            evidence_docs: [선물환 계약 명세와 은행 확인, 위험회피 문서화, 호선별 헤지 비율]
            priority: 2
            questions:
              - 호선별 헤지 비율과 위험회피 관계 문서화는 어떻게 관리하는가?
      - trait_id: SHP-RG
        name: 선수금 환급보증과 인도 지연
        stage: 인도
        detect_keywords: [선수금환급보증, RG, 인도 지연, 계약 취소, 지체상금]
        risks:
          # 공시 대조 ❓ HD현대중공업 공시에서 선수금환급보증·인도 지연 쟁점을 찾지 못함 → 2에서 3으로 낮춤
          - risk_id: SHP-R3
            title: 계약 취소·인도 지연 위험과 보증 공시
            potential_risk: 선주 재무 악화로 인한 계약 취소·인도 연기와 선수금 환급보증 관련 우발부채, 미인도 선박 재고 평가에 대한 확인 필요성이 존재
            accounts: [계약부채(선수금), 재고자산(미인도 선박), 우발부채 주석]
            assertions: [완전성, 평가와배분, 표시와공시]
            references: [K-IFRS 제1037호, K-IFRS 제1115호, K-IFRS 제1002호]
            evidence_docs: [선주별 대금 회수 현황, 인도 연기·취소 협의 문서, RG 발급 내역]
            priority: 3
            questions:
              - 인도가 연기되거나 대금 지급이 늦은 선주가 있는가? 취소 시 재매각 가정은?

      - trait_id: SHP-VAR
        name: 공사변경과 계약자산
        stage: 건조
        detect_keywords: [공사변경, 설계변경, 계약자산, 미청구공사, 클레임]
        risks:
          # 공시 대조 ➕추가 HD현대중공업: 핵심감사사항 '공사변경에 따른 회계처리의 적절성' — 초안에 없던 항목
          - risk_id: SHP-R4
            title: 공사변경(계약변경)·클레임의 수익 반영
            potential_risk: 발주처와의 공사변경·클레임 금액을 계약금액에 반영하는 시점과 금액(발주처 승인 전 반영 여부)에 대한 확인 필요성이 존재
            accounts: [매출(공사수익), 계약자산]
            assertions: [발생사실, 정확성, 기간귀속]
            references: [K-IFRS 제1115호, 감사기준서 540]
            evidence_docs: [공사변경 합의서·발주처 승인 문서, 클레임 협상 진행 자료, 계약금액 변경 내역]
            priority: 1
            questions:
              - 발주처 승인 전인 공사변경 금액을 계약금액에 반영한 것이 있는가? 반영 근거는?
              - 협상 중인 클레임은 수익 인식에서 어떻게 다뤘는가?
          # 공시 대조 ➕추가 HD현대중공업: 핵심감사사항 '계약자산금액의 회수가능성에 대한 평가'
          - risk_id: SHP-R5
            title: 계약자산(미청구공사)의 회수가능성
            potential_risk: 진행률로 인식했지만 아직 청구하지 못한 계약자산이 인도 시점 잔금으로 회수될 수 있는지(발주처 신용·인도 지연)에 대한 확인 필요성이 존재
            accounts: [계약자산, 손실충당금]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1115호, K-IFRS 제1109호]
            evidence_docs: [호선별 계약자산 명세, 발주처 신용 정보, 인도 일정과 잔금 조건]
            priority: 1
            questions:
              - 계약자산이 큰 호선의 인도 일정과 잔금(헤비테일) 조건은?
              - 발주처의 재무 상태 악화나 인도 연기 요청이 있는 호선이 있는가?

  food_beverage:
    name: 식음료 제조업
    group: 소비재
    review: {status: draft, note: "2026-11-15 CJ제일제당 2025 사업보고서와 대조·수정 (감사인 삼일). 승인 전"}
    summary: "농수산 원료를 가공해 대형마트·편의점·대리점 채널로 파는 소비재 산업. 판매장려금·리베이트, 유통기한 재고, 원재료 가격 변동이 핵심이다"
    ksic_prefixes: ["10", "11"]
    detect_keywords: [식품, 음료, 주류, 제과, 라면, 유통채널, 대형마트, 원맥, 원당, 가공식품]
    profile:
      business_model:
        - 밀·원당·대두 등 농수산 원료를 사들여 가공식품·음료·주류를 만든다
        - 대형마트·편의점·온라인·대리점 채널에 판매하며 채널에 판매장려금·판촉비를 준다
        - 원료 가격과 환율이 원가를, 브랜드와 신제품이 판매량을 좌우한다
      value_chain: [원재료 구매, 생산·가공, 채널 판매, 판촉·장려금, 재고·유통기한 관리]
      stakeholders: [농수산 원료 공급사, 대형마트·편의점·온라인몰, 대리점, 식품의약품안전처, 소비자]
      stage_info:
        원재료 구매:
          icon: ship
          do: "원맥·원당·대두 등 원료를 국내외에서 들여온다"
          money: "회사 → 원료사: 원료 대금(외화)"
          books: "재고자산(원재료), 매입채무, 외화환산"
        생산·가공:
          icon: food
          do: "공장에서 원료를 가공해 제품을 만들고 포장한다"
          money: "인건비·포장재비·에너지비가 원가에 쌓인다"
          books: "제품·재공품, 유형자산, 원가계산"
        채널 판매:
          icon: store
          do: "대형마트·편의점·대리점에 제품을 공급한다"
          money: "유통채널 → 회사: 판매대금"
          books: "매출, 매출채권"
        판촉·장려금:
          icon: brand
          do: "채널 행사와 진열 대가로 판매장려금·판촉비를 지급한다"
          money: "회사 → 유통채널: 판매장려금·리베이트"
          books: "매출 차감(고객에게 지급할 대가), 미지급금"
        재고·유통기한 관리:
          icon: package
          do: "유통기한이 다가오는 제품을 관리하고 반품을 받는다"
          money: "반품·폐기는 손실로 나간다"
          books: "재고자산평가손실, 반품충당(환불부채)"
    traits:
      - trait_id: FNB-REBATE
        name: 유통채널 판매장려금
        stage: 판촉·장려금
        detect_keywords: [판매장려금, 판촉, 리베이트, 대형마트, 편의점, 행사]
        risks:
          # 공시 대조 ✅ CJ제일제당: 변동대가를 기댓값 방법으로 추정해 되돌리지 않을 가능성이 매우 높은 금액까지만 수익 인식
          - risk_id: FNB-R1
            title: 판매장려금의 매출 차감과 기말 미지급 추정
            potential_risk: 유통채널에 지급하는 판매장려금·판촉비가 매출 차감 대상인지, 기말까지 확정되지 않은 장려금의 추정이 완전한지에 대한 확인 필요성이 존재
            accounts: [매출, 미지급금(판촉), 판매촉진비]
            assertions: [정확성, 완전성, 표시와공시]
            references: [K-IFRS 제1115호]
            evidence_docs: [채널별 장려금 약정, 기말 미지급 장려금 산정, 기말 후 정산 내역]
            priority: 1
            questions:
              - 채널에 지급하는 대가 중 매출에서 빼는 것과 판매비로 보는 것의 구분 기준은?
              - 기말 이후 정산된 장려금이 기말 추정액과 얼마나 차이 났는가?
      - trait_id: FNB-INV
        name: 유통기한 재고와 반품
        stage: 재고·유통기한 관리
        detect_keywords: [유통기한, 반품, 폐기, 재고, 신제품]
        risks:
          # 공시 대조 ✅ CJ제일제당: 예상 환불액을 환불부채로, 회수할 제품을 환불자산으로 인식
          - risk_id: FNB-R2
            title: 유통기한 임박 재고와 반품 추정
            potential_risk: 유통기한이 짧은 제품의 진부화 재고 평가와 채널 반품 예상분(환불부채) 추정에 대한 확인 필요성이 존재
            accounts: [재고자산, 재고자산평가손실, 환불부채]
            assertions: [평가와배분, 실재성, 완전성]
            references: [K-IFRS 제1002호, K-IFRS 제1115호]
            evidence_docs: [유통기한별 재고 연령표, 반품·폐기 실적, 재고 실사 결과]
            priority: 2
            metrics:
              - name: 재고자산 회전일수
                kind: days
                num: inventory
                den: cogs
                signal: {threshold: 15, direction: up}
                question: "재고자산 회전일수가 {prev}에서 {cur}로 늘었다. 판매 부진 제품과 유통기한 임박 재고는?"
            questions:
              - 유통기한이 얼마 남지 않은 재고는 어떻게 평가했는가?
      - trait_id: FNB-COST
        name: 원재료 가격과 환율
        stage: 원재료 구매
        detect_keywords: [원맥, 원당, 대두, 원재료 가격, 곡물, 환율]
        risks:
          # 공시 대조 ✅ CJ제일제당: 국제 곡물가격 위험을 상품선물·옵션으로 헤지, 시카고상업거래소(CME) 등 표준가격으로 평가
          - risk_id: FNB-R3
            title: 원재료 가격 급등과 원가 반영
            potential_risk: 곡물·원당 가격과 환율 급등이 원가에 반영되는 시점, 원재료 선물·장기계약의 회계처리에 대한 확인 필요성이 존재
            accounts: [매출원가, 재고자산, 파생상품]
            assertions: [정확성, 평가와배분]
            references: [K-IFRS 제1002호, K-IFRS 제1109호]
            evidence_docs: [주요 원재료 구매 단가 추이, 원재료 선물·계약 명세]
            priority: 3
            metrics:
              - name: 매출원가율
                kind: ratio
                num: cogs
                den: revenue
                signal: {threshold: 3, direction: both}
                question: "매출원가율이 {prev}에서 {cur}로 변동했다({change}). 원재료 가격·환율과 판가 인상 효과는?"
            questions:
              - 원재료 가격 상승을 판가에 언제, 얼마나 반영했는가?
              - 곡물 선물·옵션은 위험회피회계를 적용하는가? 적용하지 않으면 평가손익이 영업 실적과 어떻게 구분되는가?

      - trait_id: FNB-GW
        name: 해외 인수 사업의 영업권
        stage: 채널 판매
        detect_keywords: [영업권, 인수, 해외 법인, 종속기업투자]
        risks:
          # 공시 대조 ➕추가 CJ제일제당: 핵심감사사항이 '영업권의 회수가능가액 검토', '종속기업투자주식의 회수가능가액 검토' — 초안에 없던 항목
          - risk_id: FNB-R4
            title: 영업권·종속기업투자의 회수가능액
            potential_risk: 인수한 (해외) 사업에 배분된 영업권과 별도재무제표상 종속기업투자의 회수가능액 추정 가정에 대한 확인 필요성이 존재
            accounts: [영업권, 종속기업투자(별도), 손상차손]
            assertions: [평가와배분, 표시와공시]
            references: [K-IFRS 제1036호, 감사기준서 540]
            evidence_docs: [현금창출단위별 사용가치 계산, 인수 사업 사업계획 대비 실적, 외부 평가기관 보고서]
            priority: 1
            questions:
              - 영업권이 큰 인수 사업의 매출성장률·이익률 가정은 인수 후 실제 실적과 비교해 합리적인가?
              - 할인율·영구성장률 가정이 조금 바뀌면 손상이 생기는가(민감도)?

