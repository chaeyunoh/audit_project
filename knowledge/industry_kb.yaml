industries:
  construction:
    name: 건설업
    group: 건설·인프라
    summary: 수주한 공사를 수년에 걸쳐 수행하는 산업. 진행률·총예정원가 같은 추정과 PF 보증이 재무제표를 크게 좌우한다
    ksic_prefixes: ["41", "42"]
    detect_keywords: [건설, 수주, 공사, 도급, 시공, 분양, 플랜트, 토목, 건축]
    profile:
      business_model:
        - 발주처로부터 공사를 수주하고 계약에 따라 공사를 수행해 대가를 받는다
        - 장기 공사는 진행 정도(투입원가 기준 등)에 따라 수익을 인식하는 경우가 많다
        - 주요 원가는 재료비, 외주비(하도급), 노무비, 현장경비로 구성된다
      value_chain: [수주·입찰, 도급계약, 착공, 공사 진행, 기성 청구, 준공, 하자보수·정산]
      stakeholders: [발주처, 시행사, 하도급업체, 금융기관(PF 대주), 보증기관]
      stage_info:   # 가치사슬 단계 설명: 무슨 일 / 돈의 흐름 / 장부에 남는 것 (일러스트 키: icon)
        수주·입찰: {icon: bid, do: "발주처 입찰에 참여하거나 시행사와 협의해 공사를 따낸다", money: "입찰보증금 납부. 민간 주택사업은 시행사 PF에 책임준공·보증 제공", books: "수주잔고(공시), 지급보증·약정(주석)"}
        도급계약: {icon: contract, do: "공사 범위·계약금액·기성 조건·공기를 정해 도급계약을 맺는다", money: "발주처 → 회사: 선수금(계약금)", books: "계약부채(선수금), 계약금액 = 진행률 계산의 기준"}
        착공: {icon: groundbreak, do: "현장을 열고 실행예산(총예정원가)을 세워 하도급을 발주한다", money: "회사 → 협력업체: 선급금, 자재 선발주", books: "총공사예정원가(추정), 선급금"}
        공사 진행: {icon: build, do: "자재 투입·외주 시공으로 원가가 쌓이며 진행률이 올라간다", money: "회사 → 협력업체·자재사: 외주비·자재비·노무비", books: "공사원가, 진행률 기준 공사수익, 계약자산(미청구공사)"}
        기성 청구: {icon: invoice, do: "공정만큼 발주처에 기성금을 청구하고 회수한다", money: "발주처 → 회사: 기성금", books: "공사미수금, 계약자산·계약부채, 손실충당금"}
        준공: {icon: complete, do: "공사를 끝내고 발주처가 인수한다", money: "발주처 → 회사: 준공정산금·유보금", books: "최종 계약금액 확정, 공사손실 확정"}
        하자보수·정산: {icon: repair, do: "하자보수 기간에 대응하고 하도급을 최종 정산한다", money: "회사 → 협력업체: 최종 정산금, 하자보수 비용", books: "하자보수충당부채, 미지급 외주비"}
    traits:
      - trait_id: CON-LTC
        name: 장기공사계약
        stage: 도급계약   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [진행률, 진행기준, 투입법, 공사수익, 도급계약, 수주잔고, 수주잔액]
        risks:
          - risk_id: CON-R1
            title: 진행률 기반 수익인식
            potential_risk: 장기계약 특성상 진행률 산정과 수익 인식 금액·시점에 대한 확인 필요성이 존재
            accounts: [공사수익(매출), 계약자산(미청구공사), 계약부채(초과청구공사)]
            assertions: [발생사실, 정확성, 기간귀속]
            references: [K-IFRS 제1115호, 감사기준서 540]
            evidence_docs: [주요 도급계약서, 프로젝트별 진행률 산정표, 기성청구 내역, 계약 변경 합의서]
            metrics:
              - name: 계약자산 ÷ 매출
                kind: ratio
                num: contract_assets
                den: revenue
                signal: {threshold: 5, direction: up}
                question: "계약자산(미청구공사) ÷ 매출이 {prev}에서 {cur}로 변동했다({change}). 증가에 기여한 주요 프로젝트와 청구가 지연된 사유는?"
            priority: 1
            questions:
              - 진행률은 어떤 방식(투입원가 기준 등)으로 산정하며, 당기 중 변경이 있었는가?
              - 진행률 산정에 포함되지 않아야 할 원가(미설치 자재 등)는 어떻게 구분하는가?
              - 계약 변경(설계변경·물가변동)은 언제, 어떤 근거로 계약금액에 반영하는가?
      - trait_id: CON-EST
        name: 총공사예정원가 추정 변동
        stage: 공사 진행   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [예정원가, 원가율, 원자재, 자재비, 공사원가, 원가 상승]
        risks:
          - risk_id: CON-R2
            title: 총공사예정원가 추정
            potential_risk: 원가 변동성이 큰 산업 특성상 총공사예정원가 추정과 그 변경의 근거를 확인할 필요성이 존재
            accounts: [공사원가(매출원가), 계약자산, 공사손실충당부채]
            assertions: [평가와배분, 정확성]
            references: [K-IFRS 제1115호, 감사기준서 540]
            evidence_docs: [프로젝트별 실행예산, 총예정원가 변경 내역 및 승인 문서, 원가 변경 사유 자료]
            metrics:
              - name: 매출원가율
                kind: ratio
                num: cogs
                den: revenue
                signal: {threshold: 3, direction: both}
                question: "매출원가율이 {prev}에서 {cur}로 변동했다({change}). 원가율 변동이 큰 현장과 총예정원가 변경 내역은?"
            priority: 1
            questions:
              - 당기 중 총공사예정원가가 크게 변경된 프로젝트는 무엇인가?
              - 원가 변경의 주요 원인(자재비·외주비·공기 지연 등)은 무엇인가?
              - 예정원가 변경은 누가 검토·승인하며, 어떤 자료에 근거하는가?
              - 전기 예정원가와 실제 발생원가의 차이(소급 검토)는 어느 정도였는가?
      - trait_id: CON-LOSS
        name: 프로젝트별 수익성 변동
        stage: 공사 진행   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [손실, 원가율 상승, 적자, 공사손실, 충당부채]
        risks:
          - risk_id: CON-R3
            title: 손실 예상 프로젝트의 인식
            potential_risk: 프로젝트별 수익성 변동 특성상 손실 예상 계약의 식별·인식 완전성 확인 필요성이 존재
            accounts: [공사손실충당부채, 매출원가]
            assertions: [완전성, 평가와배분]
            references: [K-IFRS 제1115호, K-IFRS 제1037호]
            evidence_docs: [프로젝트별 손익 예측표, 경영진 프로젝트 리뷰 회의록]
            priority: 2
            questions:
              - 예상 총원가가 계약금액을 초과하는 프로젝트를 어떻게 식별하는가?
              - 기말 이후 손익 전망이 악화된 프로젝트가 있는가?
      - trait_id: CON-CRD
        name: 발주처별 대금 회수 조건
        stage: 기성 청구   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [미청구공사, 공사미수금, 대손, 대금 회수, 회수가능성, 공사비 분쟁]
        risks:
          - risk_id: CON-R4
            title: 공사미수금·계약자산 회수가능성
            potential_risk: 기성 청구·회수 구조상 채권 및 계약자산의 회수가능성 확인 필요성이 존재
            accounts: [공사미수금(매출채권), 계약자산, 손실충당금]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1109호, 감사기준서 505]
            evidence_docs: [발주처별 채권 연령분석, 기말 후 회수 내역, 분쟁·소송 현황]
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 15, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 늘었다. 회수가 지연된 발주처와 그 사유는?"
            priority: 2
            questions:
              - 장기간 청구되지 않은 미청구공사의 발생 원인은 무엇인가?
              - 발주처와 공사대금 관련 분쟁이 진행 중인 프로젝트가 있는가?
      - trait_id: CON-PF
        name: PF·지급보증 등 우발채무
        stage: 수주·입찰   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [PF, 프로젝트파이낸싱, 지급보증, 책임준공, 채무인수, 자금보충, 우발채무]
        risks:
          - risk_id: CON-R5
            title: 우발부채·금융보증의 완전성
            potential_risk: 시행사·PF 관련 보증 구조상 우발채무의 완전성 및 공시 적정성 확인 필요성이 존재
            accounts: [금융보증부채, 충당부채, 우발부채 주석]
            assertions: [완전성, 권리와의무, 표시와공시]
            references: [K-IFRS 제1037호, K-IFRS 제1109호, 감사기준서 501]
            evidence_docs: [지급보증·책임준공 약정 목록, 금융기관 조회서, 이사회 의사록, 법률 조회서]
            priority: 1
            questions:
              - 책임준공·자금보충·채무인수 약정의 전체 목록과 한도는 어떻게 관리되는가?
              - 보증 대상 사업장 중 분양률 또는 공정률이 계획에 미달하는 곳이 있는가?
      - trait_id: CON-SUB
        name: 하도급·외주 의존
        stage: 공사 진행   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [하도급, 외주, 협력업체, 외주비]
        risks:
          - risk_id: CON-R6
            title: 외주비의 기간귀속·완전성
            potential_risk: 외주 의존 구조상 기말 외주비 미계상(기성 미확정분) 여부 확인 필요성이 존재
            accounts: [외주비(매출원가), 미지급금]
            assertions: [완전성, 기간귀속]
            references: [감사기준서 330]
            evidence_docs: [하도급 기성 확인서, 기말 후 지급 내역]
            priority: 3
            questions:
              - 기말 기준 하도급 기성 중 미확정·미청구분은 어떻게 추정해 반영하는가?

  semiconductor:
    name: 반도체 제조업
    group: 제조
    summary: 대규모 설비투자와 가격 사이클이 특징인 장치산업. 재고 평가와 설비 손상·감가상각 판단이 핵심이다
    ksic_prefixes: ["2611", "2612"]
    detect_keywords: [반도체, 메모리, DRAM, 낸드, NAND, 웨이퍼, 파운드리, 패키징]
    profile:
      business_model:
        - 반도체 제품을 설계·제조해 전자기기·서버 제조사 등에 판매한다
        - 대규모 설비투자가 필요해 고정비 비중이 높고 가동률이 수익성에 큰 영향을 준다
        - 제품 가격이 수요·공급 사이클에 따라 크게 변동한다
      value_chain: [설계, 웨이퍼 제조(전공정), 패키징, 테스트, 판매]
      stakeholders: [주요 고객사(세트·서버 업체), 장비·소재 공급사, 파운드리·OSAT, 정부(보조금·세제)]
      stage_info:   # 가치사슬 단계 설명: 무슨 일 / 돈의 흐름 / 장부에 남는 것 (일러스트 키: icon)
        설계: {icon: design, do: "제품 구조와 공정을 개발한다 (자체 설계 또는 고객 설계 수탁)", money: "회사 → 연구인력·장비: 연구개발비", books: "경상연구개발비, 개발비(무형자산)"}
        웨이퍼 제조(전공정): {icon: wafer, do: "팹에서 웨이퍼에 회로를 새긴다. 장비 투자 규모가 매우 크다", money: "회사 → 장비·소재 공급사: 설비투자(CAPEX)·소재비", books: "유형자산·건설중인자산, 감가상각비, 재공품"}
        패키징: {icon: package, do: "칩을 잘라 기판에 붙이고 외부와 연결한다 (자체 또는 OSAT 외주)", money: "회사 → OSAT: 외주 가공비", books: "재공품·제품, 외주가공비"}
        테스트: {icon: test, do: "전기적 특성을 검사해 양품과 수율을 확정한다", money: "회사 → 테스트 외주사: 검사비", books: "수율이 제품 원가를 결정, 불량·체화 재고 평가"}
        판매: {icon: sell, do: "세트·서버 업체 등에 공급한다. 판가는 업황에 따라 크게 변한다", money: "고객 → 회사: 판매대금(주로 외화), 판매장려금·가격보호 정산", books: "매출·환불부채, 매출채권, 외화환산, 재고자산 평가"}
    traits:
      - trait_id: SEM-PRICE
        name: 제품가격 변동·재고 진부화
        stage: 판매   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [가격 하락, 재고, 평가손실, 수요 둔화, 판가, 업황]
        risks:
          - risk_id: SEM-R1
            title: 재고자산 순실현가능가치 평가
            potential_risk: 가격 변동·기술 진부화 특성상 재고자산의 순실현가능가치 추정 근거 확인 필요성이 존재
            accounts: [재고자산, 재고자산평가충당금, 매출원가]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1002호, 감사기준서 501, 감사기준서 540]
            evidence_docs: [제품별 재고 연령분석, 기말 후 판매단가 자료, 평가충당금 산정 내역, 재고실사 결과]
            metrics:
              - name: 재고자산 회전일수
                kind: days
                num: inventory
                den: cogs
                signal: {threshold: 20, direction: up}
                question: "재고자산 회전일수가 {prev}에서 {cur}로 늘었다. 증가분의 제품군 구성과 순실현가능가치 평가 시 반영한 판가 가정은?"
            priority: 1
            questions:
              - 당기 중 재고평가충당금 변동이 큰 제품군은 무엇인가?
              - 순실현가능가치 산정 시 사용한 예상 판매가격의 근거는 무엇인가?
              - 장기 체화 재고와 단종 예정 제품은 어떻게 식별하는가?
      - trait_id: SEM-CAPEX
        name: 대규모 설비투자
        stage: 웨이퍼 제조(전공정)   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [설비투자, 시설투자, 팹, 라인, 증설, 감가상각, 건설중인자산]
        risks:
          - risk_id: SEM-R2
            title: 유형자산 손상·감가상각
            potential_risk: 대규모 설비투자 특성상 손상징후 검토 및 내용연수·자본화 시점의 적정성 확인 필요성이 존재
            accounts: [유형자산, 건설중인자산, 감가상각비, 손상차손]
            assertions: [평가와배분, 실재성, 기간귀속]
            references: [K-IFRS 제1016호, K-IFRS 제1036호]
            evidence_docs: [설비별 가동률 자료, 건설중인자산 대체 내역, 손상검토 보고서]
            metrics:
              - name: 유형자산 증가율 − 매출 증가율
                kind: growth_gap
                num: ppe
                den: revenue
                signal: {threshold: 10, direction: up}
                question: "{cur_year}년 유형자산 증가율이 매출 증가율보다 {cur} 높다. 신규 설비의 가동 계획과 손상징후 검토 결과는?"
            priority: 1
            questions:
              - 신규 라인의 본계정 대체 시점은 어떤 기준으로 판단하는가?
              - 가동률이 낮거나 유휴 상태인 설비가 있는가?
              - 내용연수 추정을 최근 변경했는가? 그 근거는?
      - trait_id: SEM-CUST
        name: 고객 집중·계약조건
        stage: 판매   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [주요 고객, 매출처, 장기공급, 가격 보호, 판매장려금, 리베이트]
        risks:
          - risk_id: SEM-R3
            title: 변동대가 및 수익인식 조건
            potential_risk: 고객 집중 및 가격 보호·장려금 조건 특성상 변동대가 추정과 수익인식 시점 확인 필요성이 존재
            accounts: [매출, 환불부채, 매출채권]
            assertions: [발생사실, 정확성, 기간귀속]
            references: [K-IFRS 제1115호]
            evidence_docs: [주요 고객 계약서, 판매장려금·가격보호 정산 내역, 인도조건(인코텀즈) 자료]
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 15, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 늘었다. 주요 고객과의 결제조건 변경이나 기말 집중 판매가 있었는가?"
            priority: 2
            questions:
              - 주요 고객과의 계약조건(가격 보호, 물량 약정)에 당기 중 변화가 있었는가?
              - 판매장려금과 가격 조정은 언제, 어떤 추정에 근거해 매출에서 차감하는가?
      - trait_id: SEM-RND
        name: 연구개발 집약
        stage: 설계   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [연구개발, 개발비, R&D, 차세대, 공정 개발]
        risks:
          - risk_id: SEM-R4
            title: 개발비 자산화 요건
            potential_risk: 연구개발 집약 특성상 개발비 자산 인식 요건 충족 및 손상 여부 확인 필요성이 존재
            accounts: [개발비(무형자산), 경상연구개발비]
            assertions: [발생사실, 평가와배분]
            references: [K-IFRS 제1038호]
            evidence_docs: [프로젝트별 개발비 집계표, 기술적 실현가능성 검토 자료]
            priority: 3
            questions:
              - 개발비 자산화 개시 시점(기술적 실현가능성)은 어떻게 판단하는가?
      - trait_id: SEM-FX
        name: 해외 매출·외화 노출
        stage: 판매   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [수출, 해외, 환율, 외화, 달러, 파생상품, 헤지]
        risks:
          - risk_id: SEM-R5
            title: 외화환산·파생상품
            potential_risk: 해외 매출 비중이 높은 특성상 외화환산 및 위험회피 회계 적용의 확인 필요성이 존재
            accounts: [외화환산손익, 파생상품자산·부채]
            assertions: [정확성, 평가와배분, 표시와공시]
            references: [K-IFRS 제1021호, K-IFRS 제1109호]
            evidence_docs: [외화 채권·채무 명세, 파생상품 계약 목록, 금융기관 조회서]
            priority: 3
            questions:
              - 기말 외화 잔액 환산에 사용한 환율의 출처는 무엇인가?

  franchise_retail:
    name: 가맹·유통업
    group: 소비재
    summary: 가맹점에 브랜드·노하우·물품을 공급해 수익을 얻는 산업. 가맹계약의 수익인식과 매장 리스가 핵심이다
    ksic_prefixes: ["47", "56"]   # 47 소매업, 56 음식점·주점업 (7611 자동차 임대업은 오분류라 제외)
    detect_keywords: [가맹, 가맹점, 프랜차이즈, 매장, 유통, 직영점]
    profile:
      business_model:
        - 가맹점에 상표·운영 노하우를 제공하고 가맹금·로열티·물품 공급으로 수익을 얻는다
        - 직영점 운영 시 매장 임차와 재고 관리가 비용 구조의 핵심이다
      value_chain: [브랜드 개발, 가맹 모집·계약, 개점 지원, 물류·물품 공급, 운영 지원·로열티 수취]
      stakeholders: [가맹점주, 물류·제조 협력사, 임대인, 공정거래위원회]
      stage_info:   # 가치사슬 단계 설명: 무슨 일 / 돈의 흐름 / 장부에 남는 것 (일러스트 키: icon)
        브랜드 개발: {icon: brand, do: "상표·메뉴·운영 매뉴얼을 만든다", money: "회사 → 개발·마케팅: 브랜드 투자", books: "상표권(무형자산), 광고선전비"}
        가맹 모집·계약: {icon: contract, do: "정보공개서를 제공하고 가맹계약을 맺는다", money: "가맹점 → 본사: 가맹비·교육비·계약이행보증금", books: "가맹수익·계약부채, 예수보증금"}
        개점 지원: {icon: store, do: "입지·인테리어·장비를 지원한다. 직영점은 본사가 직접 임차한다", money: "가맹점 → 본사: 인테리어·장비 대금 / 본사 → 임대인: 직영점 임차료", books: "공사·장비 매출, 사용권자산·리스부채"}
        물류·물품 공급: {icon: truck, do: "필수 원재료·소모품을 가맹점에 공급한다", money: "가맹점 → 본사: 물품대금 (차액가맹금 포함)", books: "상품매출, 가맹점 채권, 재고자산"}
        운영 지원·로열티 수취: {icon: royalty, do: "운영을 지도하고 매출에 연동된 로열티를 받는다", money: "가맹점 → 본사: 로열티·광고분담금", books: "로열티 수익, 광고분담금(예수금)"}
    traits:
      - trait_id: FRN-FEE
        name: 가맹금·로열티 수익
        stage: 가맹 모집·계약   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [가맹비, 가맹금, 로열티, 교육비, 인테리어]
        risks:
          - risk_id: FRN-R1
            title: 가맹 관련 수익의 수행의무 구분
            potential_risk: 가맹계약에 여러 약속이 묶여 있는 특성상 수행의무 구분과 수익인식 시점 확인 필요성이 존재
            accounts: [가맹수익(매출), 계약부채]
            assertions: [발생사실, 기간귀속]
            references: [K-IFRS 제1115호]
            evidence_docs: [표준 가맹계약서, 가맹금 수취·환불 내역, 정보공개서]
            priority: 1
            questions:
              - 최초 가맹금은 일시에 인식하는가, 계약기간에 걸쳐 인식하는가? 그 근거는?
              - 가맹 해지 시 가맹금 반환 조건은 무엇인가?
      - trait_id: FRN-AR
        name: 가맹점 채권·물품대
        stage: 물류·물품 공급   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [물품대, 가맹점 채권, 미수금, 폐점, 해지]
        risks:
          - risk_id: FRN-R2
            title: 가맹점 채권 회수가능성
            potential_risk: 폐점·해지 발생 구조상 가맹점 채권의 회수가능성 확인 필요성이 존재
            accounts: [매출채권, 손실충당금]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1109호]
            evidence_docs: [가맹점별 채권 연령분석, 폐점·분쟁 가맹점 목록]
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 15, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 늘었다. 회수가 지연된 가맹점과 폐점·분쟁 현황은?"
            priority: 2
            questions:
              - 당기 폐점·해지 가맹점의 채권은 어떻게 회수·처리되었는가?
      - trait_id: FRN-LEASE
        name: 매장 임차
        stage: 개점 지원   # 가치사슬(profile.value_chain) 단계
        detect_keywords: [임차, 리스, 사용권자산, 임대차, 직영점]
        risks:
          - risk_id: FRN-R3
            title: 리스 회계
            potential_risk: 다수 매장 임차 구조상 리스기간 판단과 사용권자산 손상 여부 확인 필요성이 존재
            accounts: [사용권자산, 리스부채]
            assertions: [완전성, 평가와배분]
            references: [K-IFRS 제1116호, K-IFRS 제1036호]
            evidence_docs: [임대차계약 목록, 점포별 손익, 연장선택권 판단 근거]
            priority: 2
            questions:
              - 연장선택권 행사가 상당히 확실한지 판단하는 기준은 무엇인가?
              - 영업손실이 지속되는 점포의 손상 검토를 수행했는가?

  department_store:
    name: 백화점·면세 유통업
    group: 소비재
    review: {status: reviewed, note: "2026-11-15 신세계 2025 사업보고서 주석과 대조·수정 후 검토자 승인. 상품권(DS-R2)은 공시 미확인이라 우선순위 2로 유지"}
    summary: "입점 브랜드 판매에서 수수료를 거두는 백화점과 면세점 중심의 유통업. 매출 총액·순액 표시, 포인트 이연, 점포·면세 사업의 손상이 감사 초점이다"
    ksic_prefixes: ["47111"]
    detect_keywords: [백화점, 면세, 특정매입, 직매입, 상품권, 점포, 아울렛, 입점]
    profile:
      business_model:
        - 입점 브랜드와 특정매입(재고는 브랜드 부담, 판매 시점에 매입) 또는 임대 계약을 맺고 판매액의 일정 비율을 수수료로 받는다
        - 직매입(회사가 재고 위험 부담) 상품과 자체·수입 브랜드는 판매액 전체를 매출로 인식한다
        - 면세점은 공항·시내 특허를 받아 운영하며 임차료와 특허수수료가 주요 비용이다
      value_chain: [상품 조달, 점포 운영, 판매·결제, 상품권·포인트, 정산·수수료]
      stakeholders: [입점 브랜드(협력회사), 고객, 카드사, 공항공사 등 임대인, 관세청(면세 특허)]
      stage_info:
        상품 조달:
          icon: contract
          do: "브랜드와 특정매입·직매입·임대 중 하나의 형태로 계약한다"
          money: "직매입은 회사 → 공급사 매입대금, 특정매입은 판매 후 정산"
          books: "직매입 재고자산 (특정매입은 회사 재고로 잡지 않음)"
        점포 운영:
          icon: store
          do: "자가 또는 임차 점포를 운영하고 주기적으로 대규모 리뉴얼 투자를 한다"
          money: "회사 → 임대인·시공사: 임차료, 리뉴얼 투자"
          books: "유형자산·사용권자산, 리스부채, 감가상각비"
        판매·결제:
          icon: sell
          do: "고객이 매장에서 결제하고 회사가 판매대금 전액을 받는다"
          money: "고객·카드사 → 회사: 판매대금"
          books: "매출(직매입은 총액, 특정매입은 수수료 순액), 카드미수금"
        상품권·포인트:
          icon: giftcard
          do: "상품권을 미리 팔고, 구매액에 따라 포인트를 적립해 준다"
          money: "고객 → 회사: 상품권 대금(사용 전에 먼저 받음)"
          books: "계약부채(상품권·포인트), 사용·소멸 시 수익"
        정산·수수료:
          icon: invoice
          do: "판매대금에서 수수료를 떼고 나머지를 입점 브랜드에 지급한다"
          money: "회사 → 입점 브랜드: 판매대금 − 수수료"
          books: "매입채무·미지급금, 수수료 수익"
    traits:
      - trait_id: DS-GROSSNET
        name: 거래 형태가 섞인 매출 (본인·대리인)
        stage: 판매·결제
        detect_keywords: [특정매입, 직매입, 임대매장, 순액으로, 수수료 매출, 판매수수료]
        risks:
          # 공시 대조 ✅ 신세계: "대리인 역할을 수행하는 특정매장의 상품매출… 판매대가에서 특정매입원가를 차감한 순액을 수익으로 인식"
          - risk_id: DS-R1
            title: 매출의 총액·순액 표시
            potential_risk: 직매입·특정매입·임대 등 거래 형태가 섞여 있어 본인·대리인 판단과 매출 총액·순액 표시에 대한 확인 필요성이 존재
            accounts: [매출(상품매출·수수료수익), 매출원가]
            assertions: [발생사실, 정확성, 표시와공시]
            references: [K-IFRS 제1115호, 감사기준서 315]
            evidence_docs: [거래 형태별 매출 집계표, 특정매입·임대 대표 계약서, 재고위험·가격결정권 판단 근거]
            priority: 1
            questions:
              - 거래 형태(직매입·특정매입·임대)별 매출 비중과 각 형태의 회계처리(총액 또는 순액)는?
              - 특정매입 계약에서 재고 위험과 가격 결정권이 누구에게 있다고 판단했는가? 계약상 근거는?
              - 당기 중 거래 형태가 바뀐 브랜드(직매입과 특정매입 사이)가 있는가?
      - trait_id: DS-GIFT
        name: 상품권 판매
        stage: 상품권·포인트
        detect_keywords: [상품권, 미회수, 선수금, 계약부채]
        risks:
          - risk_id: DS-R2
            title: 상품권 부채와 미회수분 수익 인식
            potential_risk: 장기간 사용되지 않는 상품권을 수익으로 인식하는 시점·금액 추정과 상품권 부채의 완전성에 대한 확인 필요성이 존재
            accounts: [계약부채(상품권), 매출(상품권 미회수 수익)]
            assertions: [완전성, 평가와배분, 기간귀속]
            references: [K-IFRS 제1115호, 감사기준서 540]
            evidence_docs: [상품권 발행·회수 대장, 발행연도별 회수율 분석, 미회수 상품권 수익 인식 정책]
            # 공시 대조 ❓ 신세계 사업보고서에서 상품권은 결제수단으로만 나오고 회계정책은 확인하지 못함 → 1에서 2로 낮춤
            priority: 2
            questions:
              - 상품권 미회수분을 수익으로 인식하는 기준(경과 기간·회수율 추정)은 무엇이며 당기에 바뀌었는가?
              - 상품권 발행 대장의 미회수 잔액과 장부상 상품권 부채를 대사하는가?
      - trait_id: DS-POINT
        name: 고객 포인트·멤버십
        stage: 상품권·포인트
        detect_keywords: [포인트, 마일리지, 멤버십]
        risks:
          # 공시 대조 ✅ 신세계: "고객충성제도와 관련한 계약부채를 이연수익(기타유동부채)으로 계상"
          - risk_id: DS-R3
            title: 포인트의 거래가격 배분과 이연
            potential_risk: 포인트 적립을 별도 수행의무로 보고 거래가격을 배분·이연하는 과정의 사용률 추정에 대한 확인 필요성이 존재
            accounts: [계약부채(이연수익·기타유동부채), 매출]
            assertions: [정확성, 평가와배분, 기간귀속]
            references: [K-IFRS 제1115호]
            evidence_docs: [포인트 적립·사용·소멸 내역, 사용률 추정 근거, 제휴 포인트 정산 계약]
            priority: 2
            questions:
              - 포인트 사용률 추정은 어느 기간의 실적에 근거하는가?
              - 제휴사(카드사 등)가 부담하는 포인트는 어떻게 회계처리하는가?
      - trait_id: DS-STORE
        name: 점포·사업부 자산과 영업권
        stage: 점포 운영
        detect_keywords: [점포, 리뉴얼, 신규 출점, 출점, 사용권자산, 증축, 영업권]
        risks:
          # 공시 대조 ⚠️→수정 신세계: 현금창출단위 손상을 사용권자산에 배분, 신세계라이브쇼핑 영업권 손상평가가 핵심감사사항
          #   → 초안에 없던 '영업권'을 추가하고, 핵심감사사항이므로 우선순위를 2에서 1로 올림
          - risk_id: DS-R4
            title: 점포·사업부(현금창출단위) 손상과 영업권
            potential_risk: 점포·사업부별 수익성이 낮아질 때 유형자산·사용권자산 손상과, 인수한 사업에 배분된 영업권의 회수가능액 추정에 대한 확인 필요성이 존재
            accounts: [유형자산, 사용권자산, 영업권, 리스부채, 손상차손]
            assertions: [평가와배분, 완전성]
            references: [K-IFRS 제1036호, K-IFRS 제1116호, 감사기준서 540]
            evidence_docs: [현금창출단위 구분과 영업권 배분 내역, 사용가치 계산(매출성장률·할인율), 외부 평가기관 보고서, 점포별 손익]
            priority: 1
            metrics:
              - name: 유형자산 증가율 − 매출 증가율
                kind: growth_gap
                num: ppe
                den: revenue
                signal: {threshold: 10, direction: up}
                question: "{cur_year}년 유형자산 증가율이 매출 증가율보다 {cur} 높다. 신규 출점·리뉴얼 투자의 회수 계획과 손상징후 검토 결과는?"
            questions:
              - 영업손실이 이어지는 점포·사업부에 대해 손상검토를 했는가? 회수가능액 추정의 핵심 가정(매출성장률·할인율)은?
              - 영업권이 배분된 현금창출단위는 어디이며, 사용가치 계산에 쓴 사업계획은 과거 실적과 비교해 달성 가능한가?
              - 손상검토에 외부 전문가를 썼다면, 그 전문가의 적격성과 평가 방법을 어떻게 검토했는가?
              - 리뉴얼 중인 점포의 건설중인자산은 언제 본계정으로 대체하는가?
      - trait_id: DS-INV
        name: 직매입·수입 브랜드 재고
        stage: 상품 조달
        detect_keywords: [수입 브랜드, 해외 브랜드, 패션, 화장품, 자체 브랜드, 직매입]
        risks:
          - risk_id: DS-R5
            title: 직매입·자체 브랜드 재고 평가
            potential_risk: 시즌성 패션·수입 브랜드 재고의 진부화와 순실현가능가치 추정에 대한 확인 필요성이 존재
            accounts: [재고자산, 재고자산평가충당금, 매출원가]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1002호, 감사기준서 501]
            evidence_docs: [시즌·연령별 재고 분석, 기말 후 판매가와 할인율, 재고실사 결과]
            priority: 2
            metrics:
              - name: 재고자산 회전일수
                kind: days
                num: inventory
                den: cogs
                signal: {threshold: 20, direction: up}
                question: "재고자산 회전일수가 {prev}에서 {cur}로 늘었다. 증가분의 브랜드·시즌 구성과 평가충당금 설정 기준은?"
            # 공시 대조 ✅ 신세계: 재고평가손실 174억원(연결), 매장상품 원가는 '소매재고법' → 소매재고법 질문 추가
            questions:
              - 지난 시즌 재고의 평가충당금 설정 기준(경과 시즌·할인율)은?
              - 매장상품에 소매재고법을 쓴다면 원가율은 어떻게 산정하며, 할인 판매가 많은 해에 원가율이 왜곡되지 않는가?
              - 해외 수입 브랜드와의 반품·재고 처리 조건은?
      - trait_id: DS-DUTY
        name: 면세 사업장
        stage: 점포 운영
        detect_keywords: [면세, 공항, 특허, 임차료, 여객]
        risks:
          # 공시 대조 ❌→수정 신세계: 실제 쟁점은 임차료 구조가 아니라 면세 자회사(신세계디에프) 손상
          #   — 2년 연속 종속기업투자 손상(711억원 → 816억원), 연결·별도 모두 핵심감사사항 → 방향을 바꾸고 3에서 1로 올림
          - risk_id: DS-R6
            title: 면세 사업 손상 (현금창출단위·종속기업투자)
            potential_risk: 면세 사업의 수익성 악화로 관련 자산(사용권자산·유형자산)과 별도재무제표상 종속기업투자의 회수가능액 추정에 대한 확인 필요성이 존재
            accounts: [사용권자산, 유형자산, 종속기업투자(별도), 손상차손]
            assertions: [평가와배분, 표시와공시]
            references: [K-IFRS 제1036호, K-IFRS 제1116호, 감사기준서 540]
            evidence_docs: [면세 사업 사용가치 계산(여객 수요·매출 회복·할인율), 외부 평가기관 보고서, 공항 임대차 계약, 면세 사업부 손익]
            priority: 1
            questions:
              - 면세 사업 사용가치 계산의 매출 회복 가정(여객 수요·객단가)은 최근 실적과 비교해 합리적인가?
              - 전기에 손상을 인식한 뒤 당기에 다시 손상이 났다면, 전기 사업계획 대비 실적 차이(소급 검토)는 얼마였는가?
              - 공항 임대료 구조(고정액·매출 연동)가 바뀌었다면 리스부채 재측정과 손상검토에 어떻게 반영했는가?

  secondary_battery:
    name: 2차전지 제조업
    group: 제조
    review: {status: reviewed, note: "2026-11-15 LG에너지솔루션 2025 사업보고서 주석과 대조·수정 후 검토자 승인. 메탈 연동 판가(BAT-R2)는 공시 미확인이라 우선순위 2로 유지"}
    summary: "완성차와 장기 공급계약을 맺고 대규모 해외 공장을 짓는 장치산업. 판매보증 충당부채, 합작법인 지배력 판단, 세액공제 회계, 설비 손상이 핵심이다"
    ksic_prefixes: ["2820"]
    detect_keywords: [배터리, 이차전지, 2차전지, 양극재, ESS, 전기차, EV, 셀]
    profile:
      business_model:
        - 완성차(OEM)와 수년 단위 공급계약을 맺고 전기차·ESS용 배터리 셀·모듈·팩을 생산해 공급한다
        - 판매가격은 리튬·니켈 등 원재료(메탈) 가격에 연동되어 일정 시차를 두고 조정된다
        - 고객 가까이(북미·유럽)에 대규모 공장을 짓고, 일부는 완성차와 합작법인으로 운영한다
      value_chain: [원재료 조달, 수주·개발, 셀·모듈 생산, 품질 검사, 완성차 공급, 보증·리콜 대응]
      stakeholders: [완성차 고객사(OEM), 소재 공급사(양극재·음극재), 합작 파트너, 각국 정부(보조금·세액공제), 금융기관]
      stage_info:
        원재료 조달:
          icon: truck
          do: "리튬·니켈·코발트 등 메탈과 양극재·음극재를 장기계약으로 들여온다"
          money: "회사 → 소재 공급사: 원재료 대금 (메탈 시세 연동)"
          books: "재고자산(원재료), 매입채무"
        수주·개발:
          icon: contract
          do: "완성차 차종별로 수년 단위 공급계약을 따내고 셀을 맞춤 개발한다"
          money: "고객 → 회사: 일부 개발비·선수금"
          books: "계약 조건이 수익인식과 손실부담계약 판단의 기초가 됨"
        셀·모듈 생산:
          icon: battery
          do: "대규모 라인에서 셀을 만들고 모듈·팩으로 조립한다"
          money: "회사 → 설비 공급사·건설사: 설비투자(CAPEX)"
          books: "유형자산·건설중인자산, 감가상각비, 재공품"
        품질 검사:
          icon: test
          do: "성능·안전성을 검사하고 수율을 관리한다"
          money: "불량은 폐기·재작업 비용으로 나간다"
          books: "수율이 제품 원가를 결정, 불량 재고 평가"
        완성차 공급:
          icon: sell
          do: "고객 공장으로 납품한다. 메탈 가격 변동은 나중에 판가로 정산된다"
          money: "고객 → 회사: 판매대금(외화), 판가 조정 정산"
          books: "매출·매출채권, 판가 조정 관련 부채, 외화환산"
        보증·리콜 대응:
          icon: repair
          do: "품질 문제나 화재 사고가 나면 리콜 비용을 고객과 나눠 부담한다"
          money: "회사 → 고객: 리콜 분담금·보상"
          books: "판매보증충당부채, 리콜 비용"
    traits:
      - trait_id: BAT-CAPEX
        name: 대규모 해외 공장 투자
        stage: 셀·모듈 생산
        detect_keywords: [증설, 신규 공장, 북미, 가동률, 설비투자, 시설투자, 생산능력]
        risks:
          - risk_id: BAT-R1
            title: 신설 공장 설비의 손상과 대체 시점
            potential_risk: 전기차 수요 둔화로 가동률이 낮아질 때 대규모 신설 공장의 손상 징후와 건설중인자산 본계정 대체 시점에 대한 확인 필요성이 존재
            accounts: [유형자산, 건설중인자산, 감가상각비, 손상차손]
            assertions: [평가와배분, 실재성, 기간귀속]
            references: [K-IFRS 제1016호, K-IFRS 제1036호, 감사기준서 540]
            evidence_docs: [공장·라인별 가동률, 건설중인자산 대체 내역, 현금창출단위별 손상검토(사용가치 가정)]
            priority: 1
            metrics:
              - name: 유형자산 증가율 − 매출 증가율
                kind: growth_gap
                num: ppe
                den: revenue
                signal: {threshold: 10, direction: up}
                question: "{cur_year}년 유형자산 증가율이 매출 증가율보다 {cur} 높다. 신설 라인의 가동 계획과 손상검토의 수요 가정은?"
            questions:
              - 가동률이 계획에 못 미치는 공장·라인은? 손상검토의 매출·가동률 가정은 고객 수요 전망과 맞는가?
              - 신설 라인의 상업생산 개시(본계정 대체)는 어떤 기준으로 판단하는가?
      - trait_id: BAT-METAL
        name: 메탈 가격 연동 판가
        stage: 완성차 공급
        detect_keywords: [메탈, 리튬, 니켈, 판가, 원재료 가격, 연동]
        risks:
          - risk_id: BAT-R2
            title: 메탈 연동 판가 조정(변동대가)과 재고 평가
            potential_risk: 원재료 가격이 시차를 두고 판가에 반영되는 구조라 기말 미확정 판가 조정분 추정과 재고의 순실현가능가치에 대한 확인 필요성이 존재
            # 공시 대조 ❓ LG에너지솔루션 주석에서 메탈 연동 판가·변동대가 회계정책을 찾지 못함 → 1에서 2로 낮춤
            accounts: [매출, 환불부채·미지급금(판가 조정), 재고자산]
            assertions: [정확성, 기간귀속, 평가와배분]
            references: [K-IFRS 제1115호, K-IFRS 제1002호]
            evidence_docs: [고객별 메탈 연동 조항, 기말 판가 조정 추정 내역, 기말 후 판가 정산 실적]
            priority: 2
            metrics:
              - name: 재고자산 회전일수
                kind: days
                num: inventory
                den: cogs
                signal: {threshold: 20, direction: up}
                question: "재고자산 회전일수가 {prev}에서 {cur}로 늘었다. 증가분의 구성(원재료·제품)과 메탈 가격 하락이 순실현가능가치에 반영됐는지?"
            questions:
              - 기말에 확정되지 않은 판가 조정분을 어떻게 추정해 매출에 반영했는가?
              - 메탈 가격 하락기에 원재료·제품 재고의 순실현가능가치를 어떻게 산정했는가?
      - trait_id: BAT-CREDIT
        name: 생산 세액공제·보조금
        stage: 셀·모듈 생산
        detect_keywords: [IRA, 생산세액공제, AMPC, 첨단제조, 45X]
        risks:
          # 공시 대조 ✅ LG에너지솔루션: IRA 첨단제조 생산세액공제를 "수취할 것으로 예상되는 수익금액"으로 인식
          - risk_id: BAT-R3
            title: 생산 세액공제(보조금)의 회계처리와 표시
            potential_risk: 미국 IRA 첨단제조 생산세액공제 등 정부 지원의 회계처리 기준(정부보조금 또는 법인세) 선택과 손익 표시, 수취가능성에 대한 확인 필요성이 존재
            accounts: [정부보조금(원가 차감 등), 미수금, 법인세]
            assertions: [표시와공시, 발생사실, 평가와배분]
            references: [K-IFRS 제1020호, K-IFRS 제1012호]
            evidence_docs: [세액공제 산정 내역, 수령·양도(현금화) 실적, 회계정책 판단 메모]
            priority: 1
            questions:
              - 생산세액공제를 어느 기준서로 회계처리했고 그 판단 근거는?
              - 세액공제를 '수취 예상 금액'으로 언제(생산·판매 시점) 인식하며, 기말 미수 금액의 회수(양도·환급) 실적은?
              - 세액공제 금액이 영업이익에 미치는 영향과 공시 방법은?
      - trait_id: BAT-JV
        name: 완성차 합작법인
        stage: 수주·개발
        detect_keywords: [합작, 합작법인, JV, 조인트벤처]
        risks:
          # 공시 대조 ⚠️→수정 LG에너지솔루션: Ultium Cells "소유지분은 과반수 미만이나, 주주간 약정에 의해 … 지배력이 있는 것으로 판단"
          #   → 지분율과 다른 결론을 내린 판단이 실제로 있으므로 2에서 1로 올림
          - risk_id: BAT-R4
            title: 합작법인의 지배력·공동약정 판단
            potential_risk: 지분 과반수 미만인 합작법인을 주주간 약정에 근거해 연결하는 등, 지배력·공동지배 판단(연결 또는 지분법)과 약정 조건에 대한 확인 필요성이 존재
            accounts: [종속기업·공동기업투자, 비지배지분, 연결범위]
            assertions: [표시와공시, 완전성, 권리와의무]
            references: [K-IFRS 제1110호, K-IFRS 제1111호, K-IFRS 제1112호]
            evidence_docs: [합작계약서(의사결정 구조·지분율), 이사회 구성, 생산물 인수 약정]
            priority: 1
            questions:
              - 합작법인의 관련활동(생산·가격)에 대한 의사결정 권한은 누구에게 있는가?
              - 지분이 과반수 미만인데 지배력이 있다고 본 근거(주주간 약정상 의결권·원가관리 권한)는 무엇이며, 약정이 당기에 바뀌었는가?
              - 생산물을 파트너가 사실상 전량 인수하는 구조라면 공동영업 해당 여부를 검토했는가?
      - trait_id: BAT-WARRANTY
        name: 품질보증·리콜
        stage: 보증·리콜 대응
        detect_keywords: [리콜, 품질보증, 화재, 판매보증]
        risks:
          # 공시 대조 ⚠️→수정 LG에너지솔루션: 판매보증충당부채가 핵심감사사항 — 경험률 기반 추정분만 1조 5,499억원,
          #   '평균 보증기간·매출액·과거 claim 경험률' 또는 '리콜 대상 수량·예상 총 수리비용'으로 추정 → 2에서 1로 올림
          - risk_id: BAT-R5
            title: 판매보증·리콜 충당부채
            potential_risk: 보증기간·대상 매출·과거 클레임 경험률에 근거한 설정률 추정과, 리콜 대상 수량·총 수리비용·고객과의 비용 분담 추정의 완전성에 대한 확인 필요성이 존재
            accounts: [판매보증충당부채, 매출원가, 우발부채 주석]
            assertions: [완전성, 평가와배분, 표시와공시]
            references: [K-IFRS 제1037호, 감사기준서 540]
            evidence_docs: [리콜·품질 이슈 현황, 고객과의 비용 분담 합의, 과거 보증 실적과 충당부채 산정 내역]
            priority: 1
            questions:
              - 진행 중이거나 협의 중인 리콜과 비용 분담 비율은?
              - 보증 충당부채 설정률을 과거 실제 보증 비용과 비교해 보았는가?
              - 설정률의 기초변수(대상 매출액·클레임 실적·보증기간)는 어떤 자료에서 오며, 그 계산을 누가 검토·승인하는가?
      - trait_id: BAT-CUST
        name: 소수 완성차 고객 집중
        stage: 수주·개발
        detect_keywords: [주요 고객, 고객사, 공급계약, 수주잔고, 완성차]
        risks:
          - risk_id: BAT-R6
            title: 장기공급계약 조건과 손실부담 판단
            potential_risk: 소수 완성차 고객 집중으로 물량 미달 보상·가격 재협상 조건이 수익과 손실부담계약 판단에 미치는 영향에 대한 확인 필요성이 존재
            accounts: [매출, 매출채권, 손실부담계약 충당부채]
            assertions: [발생사실, 정확성, 완전성]
            references: [K-IFRS 제1115호, K-IFRS 제1037호]
            evidence_docs: [주요 고객 공급계약, 물량 보장·보상 조항, 고객별 매출과 채권 연령]
            priority: 2
            metrics:
              - name: 매출채권 회전일수
                kind: days
                num: receivables
                den: revenue
                signal: {threshold: 15, direction: up}
                question: "매출채권 회전일수가 {prev}에서 {cur}로 늘었다. 회수가 늦어진 고객과 결제조건 변경 여부는?"
            questions:
              - 고객이 약정 물량을 사지 못할 때의 보상 조항과 당기 발생액은?
              - 수익성이 낮은 차종 공급계약에 손실부담계약 검토를 했는가?

  steel:
    name: 철강업
    group: 제조
    review: {status: draft, note: "2026-11-15 현대제철 2025 사업보고서와 대조·수정 (감사인 안진). 승인 전"}
    summary: "철광석·원료탄을 녹여 쇳물을 만들고 강판으로 가공하는 대규모 장치산업. 원료 가격 변동, 재고 평가, 설비 손상과 탄소 규제가 핵심이다"
    # 242(1차 비철금속: 고려아연·풍산 등 아연·구리 제련)는 철강이 아니므로 제외 — 실제 공시 분류 오류로 발견
    ksic_prefixes: ["241", "243"]
    detect_keywords: [철강, 열연, 냉연, 후판, 고로, 전기로, 조강, 철광석, 원료탄, 강판]
    profile:
      business_model:
        - 철광석·원료탄을 장기계약과 현물로 수입해 고로·전기로에서 쇳물과 반제품(슬래브)을 만든다
        - 열연·냉연·후판 등으로 압연해 자동차·조선·건설·가전 고객에 판매하고 수출 비중이 높다
        - 판매가격은 원료 가격과 수요(중국 공급량)에 따라 분기·월 단위로 협상된다
      value_chain: [원료 조달, 제선·제강, 압연·가공, 판매·수출, 설비 유지·탄소 대응]
      stakeholders: [해외 광산·원료 공급사, 자동차·조선·건설 고객사, 유통 대리점, 환경 규제기관, 금융기관]
      stage_info:
        원료 조달:
          icon: ship
          do: "철광석·원료탄을 해외에서 장기계약과 현물로 들여온다"
          money: "회사 → 광산·트레이더: 원료 대금(달러)"
          books: "재고자산(원료), 매입채무, 외화환산"
        제선·제강:
          icon: furnace
          do: "고로·전기로에서 쇳물을 만들고 불순물을 제거해 슬래브로 굳힌다"
          money: "회사 → 에너지·설비: 전력·연료비, 설비투자"
          books: "유형자산(고로·전기로), 감가상각비, 재공품, 배출부채"
        압연·가공:
          icon: coil
          do: "슬래브를 눌러 열연·냉연·후판 같은 제품으로 만든다"
          money: "가공비가 제품 원가에 쌓인다"
          books: "제품 재고, 원가계산(결합원가·부산물)"
        판매·수출:
          icon: sell
          do: "자동차·조선사와 분기 단위로 가격을 정해 공급하고 수출한다"
          money: "고객 → 회사: 판매대금(원화·외화), 판가 소급 정산"
          books: "매출·매출채권, 판가 조정 부채, 외화환산"
        설비 유지·탄소 대응:
          icon: repair
          do: "고로 개수와 정기 보수를 하고 탄소배출권을 관리한다"
          money: "회사 → 정부·시장: 배출권 구입, 보수 비용"
          books: "배출권·배출부채, 수선비, 복구충당부채"
    traits:
      - trait_id: STL-RAW
        name: 원료 가격 변동과 재고 평가
        stage: 원료 조달
        detect_keywords: [철광석, 원료탄, 원료 가격, 재고평가, 순실현가능가치, 스프레드]
        risks:
          # 공시 대조 ✅ 현대제철: 재고자산은 취득원가와 순실현가능가치 중 낮은 금액, 평가손실은 매출원가 — 회계정책 확인 (금액 공시는 미확인)
          - risk_id: STL-R1
            title: 원료·제품 재고의 순실현가능가치
            potential_risk: 원료 가격과 제품 판가의 차이(스프레드)가 줄어들 때 고가에 들여온 원료·제품 재고의 순실현가능가치 평가에 대한 확인 필요성이 존재
            accounts: [재고자산, 재고자산평가손실, 매출원가]
            assertions: [평가와배분, 실재성]
            references: [K-IFRS 제1002호, 감사기준서 501]
            evidence_docs: [품목별 재고 수불부, 기말 후 판매가격 자료, 순실현가능가치 산정표]
            priority: 1
            metrics:
              - name: 재고자산 회전일수
                kind: days
                num: inventory
                den: cogs
                signal: {threshold: 15, direction: up}
                question: "재고자산 회전일수가 {prev}에서 {cur}로 늘었다. 늘어난 재고의 품목과 판가 하락이 평가에 반영됐는지?"
            questions:
              - 판가 하락이 예상되는 제품의 순실현가능가치를 어떤 가격 자료로 산정했는가?
              - 해상 운송 중인 원료의 소유권 이전 시점과 재고 계상 기준은?
      - trait_id: STL-CAPEX
        name: 대규모 고정설비와 손상
        stage: 제선·제강
        detect_keywords: [고로, 전기로, 설비투자, 가동률, 개수, 생산능력]
        risks:
          # 공시 대조 ✅ 현대제철: 전기 설비 손상(회수가능액 미달), 당기 매각예정 설비(포항 중기·인천 STS) 손상 141억원
          - risk_id: STL-R2
            title: 설비 손상과 고로 개수 자본화
            potential_risk: 수요 둔화와 탄소 규제로 수익성이 낮아진 설비의 손상 징후와 대규모 개수 비용의 자본화 판단에 대한 확인 필요성이 존재
            accounts: [유형자산, 손상차손, 감가상각비, 수선비]
            assertions: [평가와배분, 실재성, 표시와공시]
            references: [K-IFRS 제1016호, K-IFRS 제1036호, 감사기준서 540]
            evidence_docs: [설비별 가동률, 개수 공사 내역, 현금창출단위 손상검토]
            priority: 1
            metrics:
              - name: 유형자산 증가율 − 매출 증가율
                kind: growth_gap
                num: ppe
                den: revenue
                signal: {threshold: 10, direction: up}
                question: "{cur_year}년 유형자산 증가율이 매출 증가율보다 {cur} 높다. 신규·개수 설비의 가동 계획과 손상검토 가정은?"
            questions:
              - 가동을 멈추거나 줄인 설비가 있는가? 손상검토의 판가·스프레드 가정은 무엇인가?
              - 고로 개수 비용 중 자본화한 부분과 비용 처리한 부분의 구분 기준은?
              - 매각예정으로 분류한 설비의 순공정가치(매각예정가액)는 무엇에 근거하며, 분류 시점은 적절한가?
      - trait_id: STL-PRICE
        name: 분기 판가 협상과 소급 정산
        stage: 판매·수출
        detect_keywords: [판가, 가격 협상, 소급, 수출, 자동차강판, 조선용 후판]
        risks:
          # 공시 대조 ❓ 현대제철 공시에서 판가 소급 정산의 회계처리를 찾지 못함 → 2에서 3으로 낮춤
          - risk_id: STL-R3
            title: 미확정 판가(소급 정산)의 매출 반영
            potential_risk: 분기 판가 협상이 기말까지 끝나지 않아 소급 정산되는 금액(변동대가)의 추정과 기간귀속에 대한 확인 필요성이 존재
            accounts: [매출, 환불부채·미지급금, 매출채권]
            assertions: [정확성, 기간귀속, 완전성]
            references: [K-IFRS 제1115호]
            evidence_docs: [주요 고객별 판가 협상 현황, 기말 후 확정 판가, 변동대가 추정 내역]
            priority: 3
            questions:
              - 기말 현재 판가가 확정되지 않은 고객과 물량은? 추정 판가는 어떤 근거로 정했는가?
              - 수출 거래의 인도조건(인코텀즈)별 수익인식 시점은?
      - trait_id: STL-CARBON
        name: 탄소배출권
        stage: 설비 유지·탄소 대응
        detect_keywords: [배출권, 탄소, 온실가스, CBAM, 배출부채]
        risks:
          # 공시 대조 ✅ 현대제철: 온실가스배출권(무상할당·매입)과 배출부채 회계정책을 상세히 공시
          - risk_id: STL-R4
            title: 배출권과 배출부채의 측정
            potential_risk: 무상할당량을 넘는 배출에 대한 배출부채 측정과 보유 배출권의 평가·표시에 대한 확인 필요성이 존재
            accounts: [배출권(무형자산), 배출부채, 매출원가]
            assertions: [완전성, 평가와배분, 표시와공시]
            references: [K-IFRS 제1037호, K-IFRS 제1038호]
            evidence_docs: [연도별 배출량 명세서, 무상할당 내역, 배출권 거래 내역]
            priority: 3
            questions:
              - 당기 배출량이 무상할당량을 넘었는가? 부족분은 어떤 가격으로 부채를 측정했는가?

      - trait_id: STL-GW
        name: 인수 사업 영업권
        stage: 판매·수출
        detect_keywords: [영업권, 인수, 현금창출단위]
        risks:
          # 공시 대조 ➕추가 현대제철: 감사인 핵심감사사항이 '영업권 손상검사' — 초안에 없던 항목
          - risk_id: STL-R5
            title: 영업권 손상검사
            potential_risk: 영업권이 배분된 현금창출단위의 회수가능액(사용가치) 추정에 쓰인 판매량·판가·할인율 가정에 대한 확인 필요성이 존재
            accounts: [영업권, 손상차손]
            assertions: [평가와배분, 표시와공시]
            references: [K-IFRS 제1036호, 감사기준서 540]
            evidence_docs: [현금창출단위 구분과 영업권 배분 내역, 사용가치 계산(판매량·판가·할인율), 사업계획 대비 과거 실적]
            priority: 1
            questions:
              - 영업권이 배분된 현금창출단위는 어디이며, 사용가치 계산의 판매량·판가 가정은 업황 전망과 맞는가?
              - 할인율과 영구성장률은 어떻게 정했고, 가정이 조금 바뀌면 손상이 생기는가(민감도)?

  automobile:
    name: 자동차·부품 제조업
    group: 제조
    review: {status: draft, note: "2026-11-15 현대자동차 2025 사업보고서와 대조·수정 (핵심감사사항은 조회되지 않음). 승인 전"}
    summary: "수천 개 부품을 조달해 완성차를 조립·판매하고 할부금융·A/S까지 이어지는 산업. 판매보증·리콜, 판매촉진비, 해외 법인과 부품 단가 소급이 핵심이다"
    ksic_prefixes: ["30"]
    detect_keywords: [완성차, 자동차, 차량, 부품, 판매대수, 딜러, 리콜, 전기차, 모듈]
