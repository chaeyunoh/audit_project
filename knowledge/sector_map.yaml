# 회계법인 본부(조직) 체계별 산업 분류 — '본부별 산업 지도' 화면의 근거
#
#  - sectors[].ksic : 이 섹터로 보는 KSIC 코드 접두어 (회사 업종코드 → 본부·섹터 판별, 가장 긴 접두어 우선)
#  - sectors[].kb : industry_kb.yaml의 산업 키. 비어 있으면 화면에 '준비 중'으로 표시 (지식베이스 확장 대상)
#  - kind: industry(산업 본부) / function(감사·인증 등 기능 본부 — 산업 대신 공통 검토 영역과 연결)
#  - 본부-산업 연결은 작성자 판단이 섞여 있으므로(note) 사용 전 실제 조직 기준으로 확인할 것
#  - examples 는 이해를 돕기 위한 대표 기업 예시일 뿐, 실제 담당 관계를 뜻하지 않는다
map_version: "2026.11-3"  # 11-2: 섹터별 KSIC 접두어 / 11-3: 추가 산업 연결

systems:
